# Free Supabase projects pause after a week with no activity.
# This sends one tiny read request every 3 days so the database stays awake.
name: Keep database awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://jlnsqerwiwmbqpzzcskf.supabase.co/rest/v1/decks?select=id&limit=1" \
            -H "apikey: sb_publishable_zWPRZvdU4QyCI5hlmAvCWA_Mz7_koXT" > /dev/null && echo "awake"
