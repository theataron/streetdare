<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREETDARE · Shirtless Pass</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="../fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<style>
.pp{padding:4px 0 90px}
.pp h1{font-size:clamp(2.2rem,10vw,3rem);color:var(--red);transform:rotate(-2deg);margin:12px 0 10px}
.pp .lead{font-size:1.08rem;margin:0 0 20px}
.panel{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:18px;margin:16px 0;box-shadow:var(--sh)}
.panel h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.45rem;margin-bottom:6px}
.panel .sub{margin-bottom:12px;font-size:.95rem}
.field{display:grid;gap:6px;margin-bottom:14px;text-align:left}
.field label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.field small{color:var(--mute);font-size:.85rem}
.in,.field input,.field textarea{width:100%;font:500 1.05rem "DM Sans",sans-serif;padding:14px 16px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
.at{display:flex;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding-left:14px}
.at span{font-weight:700}
.at input{border:0!important;background:transparent!important;padding-left:4px!important;outline:none}
.codein{font:400 1.7rem "Bagel Fat One",sans-serif!important;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.err{color:var(--red);font-weight:600;font-size:.92rem;margin:6px 0}
.ok{color:#1d7a43;font-weight:600;font-size:.92rem}
.small{font-size:.86rem;color:var(--mute);text-align:center;margin-top:12px}
.gbtn{display:flex!important;align-items:center;justify-content:center;gap:10px}
.gbtn svg{width:20px;height:20px}
.seatline{display:inline-block;background:var(--blush);color:var(--red);font-weight:800;border-radius:99px;padding:6px 14px;font-size:.92rem;margin-bottom:16px}
.loading{text-align:center;color:var(--mute);padding:60px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:.92rem;z-index:30;max-width:90vw;text-align:center}
.wa{background:#1f8f4e!important;color:#fff!important}
.mini{font:700 .85rem "DM Sans",sans-serif;border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:7px 13px;cursor:pointer;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-block}
.mini.red{background:var(--red);color:#fff}
.mini.plain{border-color:transparent;background:none;text-decoration:underline;color:var(--mute);padding:7px 4px}
.mini:disabled{opacity:.5}
/* night header */
.nighthead{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);border-radius:0 0 20px 20px;margin:0 -20px;padding:12px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nighthead b{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.25rem;line-height:1.05;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nighthead small{color:#d9cdc6;font-size:.8rem}
.clock{font:400 1.35rem "Bagel Fat One",sans-serif;font-variant-numeric:tabular-nums;background:var(--red);border-radius:12px;padding:6px 10px 3px;white-space:nowrap}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:10px 0 0;font-size:.88rem}
.navrow a{color:var(--mute)}
/* leaderboard */
.board{list-style:none;padding:0;margin:4px 0 0}
.board li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1.5px solid #eadfd2}
.board li:first-child{border-top:0}
.board li.me{background:var(--blush);border-radius:14px;padding:10px;margin:0 -10px;border-top-color:transparent}
.board .rk{width:28px;text-align:center;font-weight:800;font-size:1.1rem}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);background:var(--blush);display:grid;place-items:center;font-weight:800;flex:none}
.board .nm{flex:1;min-width:0}
.board .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{color:var(--mute);font-size:.82rem}
.board .pts{font:400 1.5rem "Bagel Fat One",sans-serif}
.board .pts small{font:700 .7rem "DM Sans",sans-serif;color:var(--mute);margin-left:2px}
/* dare card */
.darecard{background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:22px 18px;margin:16px 0;box-shadow:var(--sh);transform:rotate(-.6deg)}
.darecard .k{font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9;display:flex;justify-content:space-between;gap:10px}
.darecard p{font-size:1.32rem;font-weight:700;line-height:1.3;margin:12px 0 14px}
.darecard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.darecard .tags span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:700}
.darecard .btn{background:#fff;color:var(--ink)}
.darecard .btn.plain{color:#fff;background:none}
.ptsbadge{background:#fff;color:var(--red);border-radius:99px;padding:3px 10px;font-weight:800;letter-spacing:0}
/* finish sheet */
.sheet{position:fixed;inset:0;background:rgba(27,20,18,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 30px;border-top:2.5px solid var(--ink)}
.sheet h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.6rem;margin-bottom:10px}
.handoff{background:var(--ink);color:#fff;border-radius:18px;padding:16px;margin:0 0 14px}
.handoff b{display:block;font-size:1.15rem;margin-bottom:4px}
.handoff small{color:#d9cdc6}
.handoff input{margin-top:12px;font-size:1.3rem!important;text-align:center;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--ink);border-radius:99px;background:#fff;padding:8px 14px;font:700 .95rem "DM Sans",sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--bg)}
.photopick{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px dashed var(--ink);border-radius:16px;padding:12px;cursor:pointer}
.photopick img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photopick .ph{width:64px;height:64px;border-radius:10px;background:var(--blush);display:grid;place-items:center;font-size:1.7rem;flex:none}
.photopick b{display:block}
.photopick small{color:var(--mute);font-size:.85rem}
/* feed */
.notice{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:.86rem;margin:0 0 10px;display:flex;gap:8px}
.notice.warn{background:var(--blush);border-color:var(--red)}
.compose{display:grid;gap:8px;margin:6px 0 14px}
.compose textarea{min-height:52px;resize:vertical}
.compose .row{display:flex;gap:8px;align-items:center}
.compose .row .btn{width:auto;flex:1;padding:12px 16px}
.replying{font-size:.85rem;background:var(--blush);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px}
.msgs{list-style:none;padding:0;margin:0}
.msgs li{padding:12px 0;border-top:1.5px solid #eadfd2;display:flex;gap:10px}
.msgs li:first-child{border-top:0}
.msgs .av{width:34px;height:34px;font-size:.85rem}
.msgs .body{flex:1;min-width:0}
.msgs .who{font-size:.82rem;color:var(--mute)}
.msgs .who b{color:var(--ink)}
.msgs .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msgs .play{font-weight:700}
.msgs .play.void{text-decoration:line-through;opacity:.55}
.msgs .join{color:var(--mute);font-size:.9rem;font-style:italic}
.msgs img.pic{display:block;max-width:100%;max-height:340px;border-radius:14px;border:2px solid var(--ink);margin-top:8px;object-fit:cover;background:var(--blush)}
.msgs .gone{font-size:.85rem;color:var(--mute);margin-top:6px}
.msgs .quote{border-left:3px solid var(--red);padding:2px 8px;margin:4px 0;font-size:.85rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .acts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.msgs .acts button{background:none;border:0;font:600 .8rem "DM Sans",sans-serif;color:var(--mute);cursor:pointer;padding:4px 6px}
.msgs .acts button.on{color:var(--red)}
.ptag{display:inline-block;background:#d9f0e2;color:#1d7a43;border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:800;margin-left:6px;vertical-align:middle}
/* invite */
.invite{text-align:center}
.qr{width:200px;height:200px;margin:8px auto 10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px}
.qr svg{width:100%;height:100%;display:block}
.bigcode{font:400 2rem "Bagel Fat One",sans-serif;letter-spacing:.14em;margin:4px 0}
.nights{list-style:none;padding:0;margin:0}
.nights li{border-top:1.5px solid #eadfd2;padding:12px 0;display:flex;align-items:center;gap:10px}
.nights li:first-child{border-top:0}
.nights li a{flex:1;text-decoration:none}
.nights b{display:block}
.nights small{color:var(--mute)}
.ended{background:var(--ink);color:#fff;border-radius:20px;padding:18px;margin:16px 0;text-align:center}
.ended h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.6rem}
.howto{background:var(--ink);color:#fff;border-radius:20px;padding:18px;margin:16px 0}
.howto h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.4rem;margin-bottom:8px}
.howto ol{margin:0 0 14px 1.1em;padding:0;display:grid;gap:6px}
.howto .btn{background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <a class="mark display" href="/?home=1">STREETDARE</a>
    <div class="right"><button class="lang" id="lang" aria-label="Language">EN</button></div>
  </header>

  <main class="pp">
    <p class="loading" id="v-loading">…</p>

    <!-- not logged in, came with a code -->
    <section id="v-gate" hidden>
      <h1 class="display" id="gH"></h1>
      <span class="seatline" id="gSeats" hidden></span>
      <p class="lead" id="gP"></p>
      <div class="stack">
        <button class="btn gbtn" id="gGoogle" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.2 44 33 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span id="gGoogleTxt"></span>
        </button>
        <a class="btn red" id="gEmail"></a>
      </div>
      <p class="small" id="gSmall"></p>
    </section>

    <!-- logged in, profile missing name / username -->
    <section id="v-profile" hidden>
      <h1 class="display" id="pfH"></h1>
      <p class="lead" id="pfP"></p>
      <form id="pfForm" novalidate>
        <div class="field"><label id="pfNameL" for="pfName"></label><input id="pfName" maxlength="40" autocomplete="given-name" required></div>
        <div class="field"><label id="pfUserL" for="pfUser"></label>
          <div class="at"><span>@</span><input id="pfUser" class="in" maxlength="20" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" required></div>
          <small id="pfUserMsg"></small></div>
        <div class="field"><label id="pfIgL" for="pfIg"></label>
          <div class="at"><span>@</span><input id="pfIg" class="in" maxlength="30" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></div>
          <small id="pfIgS"></small></div>
        <p class="err" id="pfErr" hidden></p>
        <button class="btn red" type="submit" id="pfBtn"></button>
      </form>
    </section>

    <!-- first person: name the night -->
    <section id="v-first" hidden>
      <h1 class="display" id="fH"></h1>
      <p class="lead" id="fP"></p>
      <form id="fForm" novalidate>
        <div class="field"><input id="fName" maxlength="40" required></div>
        <p class="err" id="fErr" hidden></p>
        <button class="btn red big" type="submit" id="fBtn"></button>
      </form>
      <p class="small" id="fSmall"></p>
    </section>

    <!-- joining a night that already started -->
    <section id="v-join" hidden>
      <h1 class="display" id="jH"></h1>
      <p class="lead" id="jP"></p>
      <p class="err" id="jErr" hidden></p>
      <button class="btn red big" type="button" id="jBtn"></button>
    </section>

    <!-- something is wrong with the code -->
    <section id="v-msg" hidden>
      <h1 class="display" id="mH"></h1>
      <p class="lead" id="mP"></p>
      <div class="stack">
        <a class="btn wa" id="mWa" target="_blank" rel="noopener"></a>
        <a class="btn" id="mHub" href="/pass/"></a>
      </div>
    </section>

    <!-- hub: no code -->
    <section id="v-hub" hidden>
      <div class="kicker" id="hK"></div>
      <h1 class="display" id="hH"></h1>
      <p class="lead" id="hP"></p>
      <section class="panel" id="hCodeBox">
        <h2 id="hCodeH"></h2>
        <p class="sub" id="hCodeP"></p>
        <form id="hForm" novalidate>
          <div class="field"><input class="in codein" id="hCode" maxlength="9" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX"></div>
          <p class="err" id="hErr" hidden></p>
          <button class="btn red" type="submit" id="hBtn"></button>
        </form>
      </section>
      <section class="panel" id="hPast" hidden>
        <h2 id="hPastH"></h2>
        <ul class="nights" id="hNights"></ul>
      </section>
      <section class="panel">
        <h2 id="hBuyH"></h2>
        <p class="sub" id="hBuyP"></p>
        <a class="btn wa" id="hWa" target="_blank" rel="noopener"></a>
      </section>
      <p class="small" id="hLogin" hidden></p>
    </section>

    <!-- the night -->
    <section id="v-night" hidden>
      <div class="nighthead">
        <div style="min-width:0"><b id="nName"></b><small id="nSub"></small></div>
        <div class="clock" id="nClock">--:--:--</div>
      </div>
      <div class="navrow"><a href="/pass/?all=1" id="nAll"></a><a href="/me/?stay=1" id="nProfile"></a></div>

      <div class="howto" id="nHow" hidden>
        <h2 id="howH"></h2>
        <ol><li id="how1"></li><li id="how2"></li><li id="how3"></li></ol>
        <button class="btn" type="button" id="howBtn"></button>
      </div>

      <div class="ended" id="nEnded" hidden><h2 id="endH"></h2><p id="endP"></p></div>

      <div id="nPlay">
        <div class="darecard" id="dCard">
          <div class="k"><span id="dK"></span><span class="ptsbadge" id="dPts"></span></div>
          <p id="dText"></p>
          <div class="tags" id="dTags"></div>
          <div class="stack">
            <button class="btn" type="button" id="dDone"></button>
            <button class="btn plain" type="button" id="dNext"></button>
          </div>
        </div>
      </div>

      <section class="panel">
        <h2 id="bH"></h2>
        <ul class="board" id="board"></ul>
      </section>

      <section class="panel">
        <h2 id="feedH"></h2>
        <div class="notice"><span>🔒</span><span id="privNote"></span></div>
        <div class="notice warn" id="photoNote"><span>📸</span><span><span id="photoNoteTxt"></span> <button class="mini" type="button" id="saveAll" style="margin-top:6px"></button></span></div>
        <form class="compose" id="cForm" novalidate>
          <div class="replying" id="cReply" hidden><span id="cReplyTxt"></span><button class="mini plain" type="button" id="cReplyX">✕</button></div>
          <textarea class="in" id="cText" maxlength="500"></textarea>
          <div class="row">
            <label class="mini" for="cFile" id="cPhotoL" style="padding:12px 14px">📷</label>
            <input type="file" id="cFile" accept="image/*" hidden>
            <button class="btn red" type="submit" id="cSend"></button>
          </div>
          <div id="cPreview" hidden class="photopick" style="border-style:solid;cursor:default"><img id="cPreviewImg" alt=""><span style="flex:1"><b id="cPreviewTxt"></b></span><button class="mini plain" type="button" id="cPreviewX">✕</button></div>
        </form>
        <ul class="msgs" id="msgs"></ul>
      </section>

      <section class="panel invite" id="inv">
        <h2 id="invH"></h2>
        <p class="sub" id="invP"></p>
        <div id="invHas">
          <div class="qr" id="invQr"></div>
          <div class="bigcode" id="invCode"></div>
          <button class="mini" type="button" id="invShare"></button>
        </div>
        <div id="invNone" hidden>
          <a class="btn wa" id="invWa" target="_blank" rel="noopener"></a>
        </div>
      </section>
    </section>
  </main>
</div>

<!-- finishing a dare -->
<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h2 id="sH"></h2>
    <div class="handoff" id="sAnsBox" hidden>
      <b id="sAnsH"></b><small id="sAnsS"></small>
      <input class="in" id="sAns" maxlength="60" autocomplete="off">
    </div>
    <div class="field" id="sWithBox" hidden>
      <label id="sWithL"></label>
      <div class="chips" id="sWith"></div>
    </div>
    <div class="field">
      <label id="sPhotoL"></label>
      <label class="photopick" for="sFile"><span class="ph" id="sPh">📸</span><img id="sImg" alt="" hidden><span><b id="sPhotoB"></b><small id="sPhotoS"></small></span></label>
      <input type="file" id="sFile" accept="image/*" hidden>
    </div>
    <p class="err" id="sErr" hidden></p>
    <div class="stack">
      <button class="btn red big" type="button" id="sGo"></button>
      <button class="btn plain" type="button" id="sCancel"></button>
    </div>
  </div>
</div>

<!-- save all photos: second tap shares (phones only allow sharing straight after a tap) -->
<div class="sheet" id="saveSheet" hidden>
  <div class="box">
    <h2 id="svH"></h2>
    <p class="sub" id="svP"></p>
    <div class="stack" style="margin-top:12px">
      <button class="btn red" type="button" id="svGo"></button>
      <div id="svLinks" class="chips"></div>
      <button class="btn plain" type="button" id="svX"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="../js/langpick.js"></script>
<script type="module">

import qrcode from '../js/vendor/qrcode.mjs';

const params = new URLSearchParams(location.search);
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

  return hub();

/* ---------- arriving with a code ---------- */
async function withCode(){
  const { data: p } = await sb.rpc('pass_preview', { p_code: code });
  if (!p || p.status === 'bad') return msg('bad');
  if (p.status === 'expired') return msg('expired');
  if (p.status === 'member') return openNight(p.night);
  if (p.status === 'ended') return msg('ended');
  if (p.status === 'full') return msg('full');
  if (!user){
    const left = p.seats - p.used;
    $('gSeats').hidden = false;
    $('gSeats').textContent = p.started ? t('gSeatsStarted', { name: p.name, l: left, s: p.seats }) : t('gSeats', { l: left, s: p.seats });
    const back = '/pass/?c=' + code;
    $('gEmail').href = '/login/?next=' + encodeURIComponent(back);
    $('gGoogle').onclick = () => sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + back } });
    return view('gate');
  }
  if (!profileReady()) return askProfile(() => withCode());
  if (!p.started){ view('first'); setTimeout(() => $('fName').focus(), 50); return; }
  const names = (p.members || []).filter(Boolean);
  renderHook = () => {
    if (current !== 'join') return;
    $('jH').textContent = t('jH', { name: p.name });
    const time = timeLeft(new Date(p.ends_at) - Date.now());
    $('jP').textContent = names.length ? t('jP', { names: joinNames(names), are: names.length === 1 ? t('isOne') : t('areMany'), time }) : t('jPEmpty', { time });
  };
  view('join');
}
function joinNames(a){ return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + a[a.length - 1]; }
function msg(kind){
  renderHook = () => { if (current === 'msg'){ $('mH').textContent = t(kind + 'H'); $('mP').textContent = t(kind + 'P'); } };
  view('msg');
}
async function activate(name){
  const { data, error } = await sb.rpc('activate_pass', { p_code: code, p_name: name || null });
  if (error || !data) return { status: 'err' };
  return data;
}
$('fForm').onsubmit = async e => {
  e.preventDefault(); $('fErr').hidden = true;
  const name = $('fName').value.trim(); if (!name){ $('fName').focus(); return; }
  const b = $('fBtn'); b.disabled = true;
  const r = await activate(name); b.disabled = false;
  handleActivate(r, 'fErr');
};
$('jBtn').onclick = async () => {
  const b = $('jBtn'); b.disabled = true; $('jErr').hidden = true;
  const r = await activate(); b.disabled = false;
  handleActivate(r, 'jErr');
};
function handleActivate(r, errId){
  if (r.status === 'ok' || r.status === 'member') return openNight(r.night, true);
  if (r.status === 'need_name'){ view('first'); return; }
  if (r.status === 'profile') return askProfile(() => withCode());
  if (r.status === 'login') return location.reload();
  if (['bad','full','ended','expired','wait'].includes(r.status)) return msg(r.status);
  $(errId).textContent = t('err'); $(errId).hidden = false;
}

/* ---------- photos: shrink on the phone before upload ---------- */
function shrink(file, max = 1200, q = 0.72){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
async function upload(blob){
  const path = night + '/' + user.id + '/' + crypto.randomUUID() + '.jpg';
  const { error } = await sb.storage.from('night-photos').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '3600' });
  if (error) throw error;
  return path;
}

  const need = paths.filter(p => p && !signed.has(p));
  if (!need.length) return;
  const { data } = await sb.storage.from('night-photos').createSignedUrls(need, 6 * 3600);
  (data || []).forEach(r => { if (r.signedUrl) signed.set(r.path, r.signedUrl); else signed.set(r.path, ''); });
}

  if (navigator.canShare && navigator.canShare({ files })){ try{ await navigator.share({ files }); }catch(e){} return; }
  $('svLinks').innerHTML = files.map((f, i) => '<a class="mini" download="' + esc(f.name) + '" href="' + URL.createObjectURL(f) + '">📸 ' + (i + 1) + '</a>').join('');
  files.forEach((f, i) => { const a = $('svLinks').children[i]; if (a) a.click(); });
};
$('svX').onclick = () => { $('saveSheet').hidden = true; };
</script>
</body>
</html>
