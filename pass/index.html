<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREETDARE · Shirtless Pass</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="../fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/night.js"></script>
<style>
.pp{padding:4px 0 90px}
.pp h1{font-size:clamp(2.2rem,10vw,3rem);color:var(--red);transform:rotate(-2deg);margin:12px 0 10px}
.pp .lead{font-size:1.08rem;margin:0 0 20px}
.panel{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:18px;margin:16px 0;box-shadow:var(--sh)}
.panel h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.45rem;margin-bottom:6px}
.panel .sub{margin-bottom:12px;font-size:.95rem}
.field{display:grid;gap:6px;margin-bottom:14px;text-align:left}
.field label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.field small{color:var(--mute);font-size:.85rem}
.pfpic{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pfav{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);background:var(--blush,#f3e7e0);flex:none;display:grid;place-items:center;font-size:1.9rem}
.pfpic small{display:block;color:var(--mute);font-size:.8rem;margin-top:5px;max-width:19ch}
.pfchk{display:flex;align-items:flex-start;gap:9px;margin-top:9px;font-size:.88rem;line-height:1.3;font-weight:600;cursor:pointer}
.pfchk input{width:19px;height:19px;flex:none;margin:0;accent-color:var(--red)}
.in,.field input,.field textarea{width:100%;font:500 1.05rem "DM Sans",sans-serif;padding:14px 16px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
.at{display:flex;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding-left:14px}
.at span{font-weight:700}
.at input{border:0!important;background:transparent!important;padding-left:4px!important;outline:none}
.codein{font:400 1.7rem "Bagel Fat One",sans-serif!important;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.err{color:var(--red);font-weight:600;font-size:.92rem;margin:6px 0}
.ok{color:#1d7a43;font-weight:600;font-size:.92rem}
.small{font-size:.86rem;color:var(--mute);text-align:center;margin-top:12px}
.gbtn{display:flex!important;align-items:center;justify-content:center;gap:10px}
.gbtn svg{width:20px;height:20px}
.seatline{display:inline-block;background:var(--blush);color:var(--red);font-weight:800;border-radius:99px;padding:6px 14px;font-size:.92rem;margin-bottom:16px}
.loading{text-align:center;color:var(--mute);padding:60px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:.92rem;z-index:60;max-width:90vw;text-align:center}
.wa{background:#1f8f4e!important;color:#fff!important}
.mini{font:700 .85rem "DM Sans",sans-serif;border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:7px 13px;cursor:pointer;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-block}
.mini.red{background:var(--red);color:#fff}
.mini.plain{border-color:transparent;background:none;text-decoration:underline;color:var(--mute);padding:7px 4px}
.mini:disabled{opacity:.5}
/* night header */
.nighthead{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);border-radius:0 0 20px 20px;margin:0 -20px;padding:12px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nighthead b{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.25rem;line-height:1.05;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nighthead small{color:#d9cdc6;font-size:.8rem}
.clock{font:400 1.35rem "Bagel Fat One",sans-serif;font-variant-numeric:tabular-nums;background:var(--red);border-radius:12px;padding:6px 10px 3px;white-space:nowrap}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:10px 0 0;font-size:.88rem}
.navrow a{color:var(--mute)}
/* leaderboard */
.board{list-style:none;padding:0;margin:4px 0 0}
.board li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1.5px solid #eadfd2}
.board li:first-child{border-top:0}
.board li.me{background:var(--blush);border-radius:14px;padding:10px;margin:0 -10px;border-top-color:transparent}
.board .rk{width:28px;text-align:center;font-weight:800;font-size:1.1rem}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);background:var(--blush);display:grid;place-items:center;font-weight:800;flex:none}
.board .nm{flex:1;min-width:0}
.board .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{color:var(--mute);font-size:.82rem}
.board .pts{font:400 1.5rem "Bagel Fat One",sans-serif}
.board .pts small{font:700 .7rem "DM Sans",sans-serif;color:var(--mute);margin-left:2px}
/* dare card */
.darecard{background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:22px 18px;margin:16px 0;box-shadow:var(--sh);transform:rotate(-.6deg)}
.darecard .k{font-weight:800;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9;display:flex;justify-content:space-between;gap:10px}
.darecard p{font-size:1.32rem;font-weight:700;line-height:1.3;margin:12px 0 14px}
.darecard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.darecard .tags span{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 10px;font-size:.8rem;font-weight:700}
.darecard .btn{background:#fff;color:var(--ink)}
.darecard .btn.plain{color:#fff;background:none}
.ptsbadge{background:#fff;color:var(--red);border-radius:99px;padding:3px 10px;font-weight:800;letter-spacing:0}
/* finish sheet */
.sheet{position:fixed;inset:0;background:rgba(27,20,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 30px;border-top:2.5px solid var(--ink)}
.sheet h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.6rem;margin-bottom:10px}
.handoff{background:var(--ink);color:#fff;border-radius:18px;padding:16px;margin:0 0 14px}
.handoff b{display:block;font-size:1.15rem;margin-bottom:4px}
.handoff small{color:#d9cdc6}
.handoff input{margin-top:12px;font-size:1.3rem!important;text-align:center;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--ink);border-radius:99px;background:#fff;padding:8px 14px;font:700 .95rem "DM Sans",sans-serif;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--bg)}
.photopick{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px dashed var(--ink);border-radius:16px;padding:12px;cursor:pointer}
.photopick img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photopick .ph{width:64px;height:64px;border-radius:10px;background:var(--blush);display:grid;place-items:center;font-size:1.7rem;flex:none}
.photopick b{display:block;text-transform:none;letter-spacing:0;color:var(--ink);font-size:.98rem}
.photopick small{color:var(--mute);font-size:.85rem;text-transform:none;letter-spacing:0;font-weight:500}
/* logo on every pass dare */
.darecard .brand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.darecard .brand .sdlogo{font-size:1.25rem;color:#fff}
.darecard .brand small{font-weight:800;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.sheetbrand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheetbrand .sdlogo{font-size:1.15rem;color:var(--redt)}
.sheetbrand small{color:var(--mute);font-size:.8rem;font-weight:700}
.sheetdare{background:var(--red);color:#fff;border-radius:16px;padding:12px 14px;font-weight:700;margin:0 0 14px;line-height:1.35}
/* feed */
.notice{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:.86rem;margin:0 0 10px;display:flex;gap:8px}
.notice.warn{background:var(--blush);border-color:var(--red)}
.compose{display:grid;gap:8px;margin:6px 0 0;border-top:1.5px solid #eadfd2;padding-top:12px}
.compose textarea{min-height:52px;resize:vertical}
.compose .row{display:flex;gap:8px;align-items:center}
.compose .row .btn{width:auto;flex:1;padding:12px 16px}
.replying{font-size:.85rem;background:var(--blush);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px}
.ptag{display:inline-block;background:#d9f0e2;color:#1d7a43;border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:800;margin-left:6px;vertical-align:middle}
/* invite */
.invite{text-align:center}
.qr{width:200px;height:200px;margin:8px auto 10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px}
.qr svg{width:100%;height:100%;display:block}
.bigcode{font:400 2rem "Bagel Fat One",sans-serif;letter-spacing:.14em;margin:4px 0}
.nights{list-style:none;padding:0;margin:0}
.nights li{border-top:1.5px solid #eadfd2;padding:12px 0;display:flex;align-items:center;gap:10px}
.nights li:first-child{border-top:0}
.nights li a{flex:1;text-decoration:none}
.nights b{display:block}
.nights small{color:var(--mute)}
.ended{background:var(--ink);color:#fff;border-radius:20px;padding:18px;margin:16px 0;text-align:center}
.shirtcard{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:var(--sh)}
.shirtcard h3{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.35rem;line-height:1.05;color:var(--redt);margin-bottom:6px}
.shirtcard p{font-size:.95rem;line-height:1.4;margin-bottom:12px}
.shirtcard .btn{display:block;text-align:center;text-decoration:none}
.ended h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.6rem}
.howto{background:var(--ink);color:#fff;border-radius:20px;padding:18px;margin:16px 0}
.howto h2{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.4rem;margin-bottom:8px}
.howto ol{margin:0 0 14px 1.1em;padding:0;display:grid;gap:6px}
.howto .btn{background:#fff;color:var(--ink)}
/* night mode */
html.night .in,html.night .field input,html.night .field textarea,html.night .at,html.night .chips button,html.night .photopick,html.night .notice,html.night .mini{background:#2a2422;color:var(--ink)}
html.night .chips button.on{background:var(--ink);color:#121012}
html.night .notice.warn{background:var(--blush);border-color:var(--red)}
html.night .board li.me{background:var(--blush)}
html.night .nighthead,html.night .howto,html.night .ended,html.night .handoff{background:#000;color:#fff}
html.night .ptag{background:#173d27;color:#7fe0a5}
html.night .qr{background:#fff}
html.night .sheet .box{background:var(--bg)}
html.night .toast{background:#f3ece3;color:#121012}
html.night .darecard .btn{background:#fff;color:#1b1412}
html.night .darecard .btn.plain{background:none;color:#fff}
html.night .howto .btn{background:#fff;color:#1b1412}
html.night .mini.wa,html.night .btn.wa{background:#1f8f4e!important;color:#fff!important}
html.night .board li,html.night .nights li{border-color:#2f2826}
/* ===== the waiting room (lobby) ===== */
.lobby{position:fixed;inset:0;z-index:40;background:var(--red);color:#fff4ea;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 22px max(18px,env(safe-area-inset-bottom));overflow-y:auto;-webkit-user-select:none;user-select:none}
.lobby[hidden]{display:none}
.lbtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lbtop .sdlogo{font-size:1.25rem;color:#fff}
.lbtop small{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.68rem;opacity:.8}
.lbhi{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:clamp(3.4rem,20vw,6rem);line-height:.92;margin:22px 0 8px;color:#fff;word-break:break-word}
.lbgroup{font-weight:800;font-size:1.05rem;opacity:.92;margin-bottom:16px}
.lbnames{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.lbnames li{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(255,255,255,.14);border:2px solid transparent;font-weight:800;font-size:.95rem;transition:background .15s,border-color .15s,transform .15s}
.lbnames li .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35);margin-left:4px}
.lbnames li.hold{background:#fff;color:var(--red);transform:scale(1.04)}
.lbnames li.hold .dot{background:#1fc16b;box-shadow:0 0 0 4px rgba(31,193,107,.3)}
.lbnames li.free{background:none;border:2px dashed rgba(255,255,255,.4);font-weight:600;opacity:.75}
.lbrules{margin:0 0 18px 1.2em;font-weight:600;font-size:.98rem;line-height:1.35;opacity:.95}
.lbrules li{margin-bottom:6px}
.lbbottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
.lbthumb{position:relative;width:132px;height:132px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .15s}
.lbthumb svg{width:70px;height:70px}
.lbthumb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(255,255,255,.35);animation:lbpulse 1.8s ease-out infinite}
.lbthumb.on{background:#fff;color:var(--red);transform:scale(.96)}
.lbthumb.on::after{border-color:#1fc16b;animation:none;inset:-10px}
.lbthumb.count svg{opacity:0}
.lbcount{position:absolute;font-family:"Bagel Fat One","Arial Black",sans-serif;font-size:4.2rem;line-height:1;color:var(--red)}
@keyframes lbpulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.lboath{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:clamp(1.5rem,6.4vw,2.6rem);line-height:1.12;color:#fff;margin:6vh 0 auto;min-height:40vh}
.lboath::after{content:"";display:inline-block;width:.085em;height:.92em;margin-left:.06em;vertical-align:-.1em;background:#fff;animation:lbcaret .7s steps(1) infinite}
.lboath.done::after{animation:none;opacity:0}
@keyframes lbcaret{0%,49%{opacity:1}50%,100%{opacity:0}}
.lobby.oath .lbhi,.lobby.oath .lbgroup,.lobby.oath .lbnames,.lobby.oath .lbrules,.lobby.oath .lbinvite,.lobby.oath .lbhost{display:none}
.lobby.oath .lbbottom{margin-top:0}
@media (prefers-reduced-motion:reduce){.lboath::after{animation:none}}
.lbhint{font-weight:700;font-size:.92rem;text-align:center;min-height:1.3em}
.lbinvite{background:none;border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:99px;padding:8px 16px;font:700 .82rem "DM Sans",sans-serif;cursor:pointer}
.lbhost{background:none;border:0;color:#fff;opacity:.75;text-decoration:underline;font:600 .8rem "DM Sans",sans-serif;cursor:pointer;padding:4px}
@media (max-height:700px){.lbhi{font-size:3.4rem;margin:12px 0 4px}.lbrules{font-size:.9rem;margin-bottom:10px}.lbthumb{width:108px;height:108px}.lbthumb svg{width:56px;height:56px}}
/* ===== the night as an app ===== */
body.inapp{overflow:hidden}
body.inapp .wrap{display:none}
.app{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;height:100dvh}
.app[hidden]{display:none}
.apptop{flex:none;display:flex;align-items:center;gap:10px;background:#1b1412;color:#fff;padding:max(10px,env(safe-area-inset-top)) 12px 10px}
.appback{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-decoration:none;min-width:44px;line-height:1}
.appback span{font-size:1.35rem;font-weight:800}
.appback small{font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:2px}
.apptitle{flex:1;min-width:0}
.apptitle b{display:block;font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.15rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apptitle small{color:#d9cdc6;font-size:.78rem}
.apptop .nightbtn{border-color:#fff;color:#fff;width:34px;height:32px;font-size:.95rem}
.apptop .clock{font-size:1.05rem;padding:6px 8px 3px}
.panes{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;overscroll-behavior:contain}
.pane[hidden]{display:none}
.pane.chat{display:flex;flex-direction:column;padding:0}
.app.typing .tabs{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1.5px solid #e6dccf;padding:4px 0 max(6px,env(safe-area-inset-bottom))}
.tabs button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--mute);font:700 .72rem "DM Sans",sans-serif}
.tabs button i{font-style:normal;font-size:1.35rem;line-height:1;filter:grayscale(1);opacity:.65}
.tabs button.on{color:var(--red)}
.tabs button.on i{filter:none;opacity:1}
/* first-run bubbles that point at the bottom menu */
.coach{position:fixed;inset:0;z-index:55;background:rgba(11,11,11,.66)}
.coach[hidden]{display:none}
.tabs.coaching{position:relative;z-index:56;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.tabs button.spot i{filter:none;opacity:1;animation:cbpop 1.1s ease-in-out infinite}
.tabs button.spot{color:var(--red)}
@keyframes cbpop{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.cbubble{position:fixed;left:14px;right:14px;z-index:57;background:var(--card);color:var(--ink);border-radius:18px;padding:15px 16px;box-shadow:0 16px 44px rgba(0,0,0,.4)}
.cbubble b{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:1.2rem;display:block;margin-bottom:5px}
.cbubble p{font-size:.93rem;line-height:1.38;margin:0 0 12px}
.cbrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cbdots{display:flex;gap:6px}
.cbdots i{width:7px;height:7px;border-radius:50%;background:#d9cfc2;display:block}
.cbdots i.on{background:var(--red)}
.cbarrow{position:absolute;bottom:-8px;width:18px;height:18px;background:var(--card);transform:rotate(45deg);border-radius:3px}
@media (prefers-reduced-motion:reduce){.tabs button.spot i{animation:none}}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font:800 .7rem/19px "DM Sans",sans-serif;padding:0 5px;border:2px solid var(--card)}
.badge.inline{position:static;display:inline-block;vertical-align:middle;margin-left:6px;border:0}
.minirank{text-align:center;color:var(--mute);font-size:.9rem;margin:6px 0 0}
.endchat{margin-top:8px;font-weight:700;color:#ffc531}
.winner{background:#1b1412;color:#fff;border-radius:20px;padding:18px;text-align:center;margin-bottom:14px}
.winner b{display:block;font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.6rem;color:#ffc531}
/* chat */
.chatlist{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chatnote{display:flex;gap:8px;font-size:.8rem;color:var(--mute);background:var(--card);border-radius:12px;padding:8px 10px;margin:0 auto 10px;max-width:420px}
.msgs{list-style:none;padding:0;margin:0}
.msgs li{display:flex;gap:8px;align-items:flex-end;margin:4px 0}
.msgs li.me{flex-direction:row-reverse}
.msgs li.cont .av{visibility:hidden}
.msgs .av{width:30px;height:30px;font-size:.8rem;flex:none}
.msgs .col{display:flex;flex-direction:column;max-width:78%;min-width:0}
.msgs li.me .col{align-items:flex-end}
.msgs .nm{font-size:.72rem;font-weight:700;color:var(--mute);margin:6px 0 2px 4px}
.bub{background:var(--card);border:1.5px solid #e6dccf;border-radius:18px 18px 18px 6px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer;line-height:1.35}
.msgs li.me .bub{background:var(--red);border-color:var(--red);color:#fff;border-radius:18px 18px 6px 18px}
.bub{position:relative;touch-action:pan-y}
.bub.swiping::before{content:"↪";position:absolute;left:-34px;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--red)}
.bub .tm{font-size:.66rem;opacity:.6;margin-left:8px;white-space:nowrap}
.bub img.pic{display:block;width:220px;max-width:100%;height:220px;object-fit:cover;border-radius:12px;margin:2px 0 4px;background:var(--blush)}
.bub .rq{border-left:3px solid currentColor;opacity:.75;padding:1px 8px;margin:2px 0 6px;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs .acts{display:flex;gap:4px;margin-top:2px}
.msgs .acts button{background:none;border:0;font:700 .75rem "DM Sans",sans-serif;color:var(--mute);cursor:pointer;padding:3px 6px}
.msgs .acts button.on{color:var(--red)}
.msgs li.sd .av{background:var(--ink);color:#fff;font:400 .62rem "Bagel Fat One",sans-serif;letter-spacing:.02em}
.msgs li.sd .bub{background:var(--card);border:2px solid var(--ink);border-radius:18px 18px 18px 6px;cursor:default;white-space:normal}
.msgs li.sd .bub h4{font:400 1.05rem "Bagel Fat One",sans-serif;color:var(--red);margin:2px 0 6px}
.msgs li.sd .bub p{margin:0 0 8px}
.msgs li.sd .bub .btn{margin:6px 0 4px;padding:11px 14px;font-size:.95rem}
html.night .msgs li.sd .bub{background:#1e1a19;border-color:#fff}
.msgs li.sys{justify-content:center;font-size:.78rem;color:var(--mute);margin:10px 0}
.msgs li.day{justify-content:center;margin:14px 0 6px}
.msgs li.day span{background:var(--card);border-radius:99px;padding:3px 12px;font-size:.72rem;font-weight:800;color:var(--mute)}
.msgs li.play{justify-content:center}
.dline{max-width:88%;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;text-align:center;box-shadow:3px 3px 0 var(--red)}
.dline .ln{font-weight:700;line-height:1.35}
.dline .ln.void{text-decoration:line-through;opacity:.55}
.dline img.pic{display:block;width:100%;max-width:260px;height:220px;object-fit:cover;border-radius:12px;margin:8px auto 0;cursor:pointer;background:var(--blush)}
.dline .meta{font-size:.72rem;color:var(--mute);margin-top:6px}
.dline .acts{justify-content:center}
.newbelow{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;background:var(--red);color:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.8rem;cursor:pointer;z-index:3;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.composer{flex:none;background:var(--card);border-top:1.5px solid #e6dccf;padding:8px 10px}
.composer .crow{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;max-height:120px;font:500 1rem "DM Sans",sans-serif;border:2px solid var(--ink);border-radius:20px;padding:9px 14px;background:#fff;color:var(--ink);line-height:1.3}
.cbtn{font-size:1.3rem;cursor:pointer;padding:6px 4px;line-height:1}
.csend{width:42px;height:42px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:1.1rem;cursor:pointer;flex:none}
.csend:disabled{opacity:.5}
.replying,.cpreview{display:flex;align-items:center;gap:8px;font-size:.82rem;background:var(--blush);border-radius:12px;padding:6px 10px;margin-bottom:6px}
.replying span,.cpreview span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpreview img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.composer .x{background:none;border:0;font-size:1rem;cursor:pointer;color:var(--mute)}
/* group pane */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--blush)}
.links{display:grid;gap:12px}
.links a{font-weight:700;color:var(--ink)}
/* photo viewer */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(50px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:72dvh;object-fit:contain;border-radius:12px;-webkit-touch-callout:default;user-select:auto}
.viewer .vx{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#1b1412;font-size:1.1rem;font-weight:800;cursor:pointer}
.vbar{width:100%;max-width:420px;margin-top:14px;text-align:center}
.vbar p{color:#d9cdc6;font-size:.85rem;margin-top:10px}
/* language choice on the start screen */
.langs{display:flex;gap:8px;flex-wrap:wrap}
.langs button{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:10px 14px;font:700 1rem "DM Sans",sans-serif;cursor:pointer;color:var(--ink)}
.langs button.on{background:var(--ink);color:var(--bg)}
html.night .langs button{background:#2a2422;color:var(--ink)}
html.night .langs button.on{background:var(--ink);color:#121012}
html.night .bub,html.night .chatnote,html.night .dline,html.night .composer,html.night .tabs,html.night .msgs li.day span{background:#211b19;border-color:#3a302d}
html.night .dline{border-color:#f3ece3}
html.night .composer textarea{background:#2a2422;color:var(--ink);border-color:#5a4b46}
html.night .msgs li.me .bub{background:var(--red);border-color:var(--red);color:#fff}
html.night .badge{border-color:#211b19}
</style>
</head>

async function withCode(){
  const { data: p } = await sb.rpc('pass_preview', { p_code: code });
  if (!p || p.status === 'bad') return msg('bad');
  if (p.status === 'expired') return msg('expired');
  if (p.status === 'member') return openNight(p.night);
  if (p.status === 'ended') return msg('ended');
  if (p.status === 'full') return msg('full');
  if (!user){
    const left = p.seats - p.used;
    $('gSeats').hidden = false;
    $('gSeats').textContent = p.started ? t('gSeatsStarted', { name: p.name, l: left, s: p.seats }) : t('gSeats', { l: left, s: p.seats });
    const back = '/pass/?c=' + code;
    $('gEmail').href = '/login/?next=' + encodeURIComponent(back);
    $('gGoogle').onclick = () => sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + back } });
    return view('gate');
  }
  if (!profileReady()) return askProfile(() => withCode());
  if (!p.started){ view('first'); paintLangs(); setTimeout(() => $('fName').focus(), 50); return; }
  if (p.lang && T[p.lang]) L = p.lang;
  const names = (p.members || []).filter(Boolean);
  renderHook = () => {
    if (current !== 'join') return;
    $('jH').textContent = t('jH', { name: p.name });

  };
  view('join');
}

function squareJpeg(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), out = 640, c = document.createElement('canvas');
      c.width = c.height = out;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url); c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

/* ---------- waiting room: the 24 hours start when everybody holds the thumb together ---------- */
let lobbyChan = null, lobbyPoll = null, holders = new Set(), myHold = false, cdT = null, starting = false, hostSure = false;
function showLobby(){
  document.body.classList.add('inapp');
  $('app').hidden = true; $('lobby').hidden = false;
  current = 'lobby'; renderHook = paintLobby;
  holders = new Set(); myHold = false; starting = false; hostSure = false;
  if (!lobbyChan){
    lobbyChan = sb.channel('lobby-' + night, { config: { presence: { key: user.id } } })
      .on('presence', { event: 'sync' }, () => {
        const st = lobbyChan.presenceState(); const h = new Set();
        Object.keys(st).forEach(k => { if (k !== user.id && (st[k] || []).some(x => x.holding)) h.add(k); });
        if (myHold) h.add(user.id);
        holders = h; paintLobby(); checkAll();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'nights', filter: 'id=eq.' + night }, refreshLobby)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'night_members', filter: 'night_id=eq.' + night }, refreshLobby)
      .subscribe(st => { if (st === 'SUBSCRIBED') lobbyChan.track({ holding: myHold }); });
  }
  clearInterval(lobbyPoll); lobbyPoll = setInterval(refreshLobby, 3000);
  paint();
}
function stopLobby(){
  clearInterval(lobbyPoll); lobbyPoll = null; cancelCount();
  if (lobbyChan){ try{ sb.removeChannel(lobbyChan); }catch(e){} lobbyChan = null; }
  $('lobby').hidden = true;
}
async function refreshLobby(){
  if (current !== 'lobby') return;
  const { data } = await sb.rpc('night_info', { p_night: night });
  if (!data) return;
  info = data;
  skew = new Date(info.now).getTime() - Date.now();
  if (info.begun_at) return openNight(night);
  paintLobby(); checkAll();
}
function paintLobby(){
  if (current !== 'lobby' || !info) return;
  const me = memberById(user.id) || { name: (profile && profile.name) || '' };
  const first = String(me.name || '').trim().split(/\s+/)[0];
  $('lbHi').textContent = t('lbHi', { name: first });
  $('lbGroup').textContent = t('lbGroup', { g: info.name, n: info.members.length });
  ['lbR1','lbR2','lbR3'].forEach(k => { $(k).textContent = t(k); });
  const free = Math.max(0, (info.seats || 0) - info.members.length);
  $('lbNames').innerHTML = info.members.map(m => '<li class="' + (holders.has(m.id) ? 'hold' : '') + '"><span class="dot"></span>' + esc(m.name) + '</li>').join('') +
    Array.from({ length: Math.min(free, 6) }, () => '<li class="free">' + esc(t('lbFree')) + '</li>').join('');
  const all = holdersAll(), n = info.members.filter(m => holders.has(m.id)).length;
  $('lbHint').textContent = starting ? t('lbStarting') : all ? t('lbHintAll') : n ? t('lbHintN', { a: n, b: info.members.length }) : t('lbHint0');
  $('lbThumb').classList.toggle('on', myHold);
  $('lbCount').textContent = '';
  const left = Math.max(0, free);
  $('lbInvite').hidden = !info.code || !left;
  $('lbInvite').textContent = t('lbInvite', { code: info.code ? fmtCode(info.code) : '', l: left });
  const host = info.host === user.id;
  $('lbHost').hidden = !host;
  $('lbHost').textContent = hostSure ? t('lbHostSure') : t('lbHostGo');
}
const holdersAll = () => info && info.members.length > 0 && info.members.every(m => holders.has(m.id));
function setHold(on){
  if (myHold === on || starting) return;
  myHold = on;
  if (on) holders.add(user.id); else holders.delete(user.id);
  if (lobbyChan) lobbyChan.track({ holding: on });
  paintLobby(); checkAll();
}
function checkAll(){
  if (starting) return;
  if (holdersAll()){ if (!cdT) startCount(); }
  else if (cdT) cancelCount();
}
/* Everyone is holding: the oath types itself out, letter by letter. Let go and it stops. */
const OATH_MS = 34;        /* ms per letter */
const OATH_HOLD_MS = 900;  /* pause on the last word before the night starts */
let oathTxt = '', oathI = 0;
function startCount(){
  const list = t('oaths'), all = Array.isArray(list) ? list : [String(list)];
  oathTxt = all[Math.floor(Math.random() * all.length)]; oathI = 0;
  const el = $('lbOath');
  el.hidden = false; el.textContent = ''; el.classList.remove('done');
  $('lobby').classList.add('oath');
  paintLobby(); if (navigator.vibrate) navigator.vibrate(30);
  cdT = setInterval(() => {
    if (!holdersAll()){ cancelCount(); return; }
    oathI++;
    el.textContent = oathTxt.slice(0, oathI);
    if (navigator.vibrate && oathTxt[oathI - 1] === ' ') navigator.vibrate(8);
    if (oathI >= oathTxt.length){
      clearInterval(cdT); cdT = null; el.classList.add('done');
      cdT = setTimeout(() => { cdT = null; if (holdersAll()) goGame(); else cancelCount(); }, OATH_HOLD_MS);
    }
  }, OATH_MS);
}
function cancelCount(){
  if (cdT){ clearInterval(cdT); clearTimeout(cdT); cdT = null; }
  oathI = 0; $('lbOath').hidden = true; $('lbOath').textContent = ''; $('lobby').classList.remove('oath');
  paintLobby();
}
async function goGame(){
  if (starting) return; starting = true; if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  paintLobby();
  await sb.rpc('start_game', { p_night: night });
  starting = false;
  await refreshLobby();
}
(() => {
  const b = $('lbThumb');
  b.addEventListener('pointerdown', e => { e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(x){} setHold(true); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, () => setHold(false)));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); setHold(true); } });
  b.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') setHold(false); });
  $('lbHost').onclick = () => { if (!hostSure){ hostSure = true; paintLobby(); setTimeout(() => { hostSure = false; paintLobby(); }, 4000); } else { hostSure = false; goGame(); } };
  $('lbInvite').onclick = async () => {
    const url = location.origin + '/pass/?c=' + (info.code || '');
    try{ if (navigator.share){ await navigator.share({ title: info.name, url }); return; } }catch(e){ return; }
    try{ await navigator.clipboard.writeText(url); toast(t('lbShared')); }catch(e){}
  };
})();

function startCoach(){

  addEventListener('resize', paintCoach); addEventListener('orientationchange', paintCoach);

function endCoach(){

/* ---------- dares ---------- */
let dare = null;
function myDone(){ return new Set(info.my_dares || []); }
const skipKey = () => 'sd_skip_' + night;
const skipped = () => { try{ return new Set(JSON.parse(store.get(skipKey()) || '[]')); }catch(e){ return new Set(); } };
// a chained dare (Snowball Selfie levels) only unlocks after the previous level is done
const dareOpen = (d, done, sk) => !done.has(d.id) && !sk.has(d.id) && (!d.chain_after || done.has(d.chain_after));
/* The dare on screen is yours until you do it or skip it: it is remembered on the phone, so
   switching tabs or apps - or the browser throwing the page away and reloading it - keeps it. */
const dareKey = () => 'sd_dare_' + night;
function keepDare(){ try{ dare ? store.set(dareKey(), String(dare.id)) : store.del(dareKey()); }catch(e){} }
function restoreDare(){
  const done = myDone(), sk = skipped();
  let id = null; try{ id = store.get(dareKey()); }catch(e){}
  const kept = id ? dares.find(d => String(d.id) === String(id) && dareOpen(d, done, sk)) : null;
  if (kept){ dare = kept; renderDare(); return; }
  pickDare();
}
function pickDare(after){
  const done = myDone(), sk = skipped();
  const nx = after ? dares.find(d => d.chain_after === after && dareOpen(d, done, sk)) : null;
  if (nx){ dare = nx; keepDare(); return renderDare(); }
  const pool = dares.filter(d => dareOpen(d, done, sk) && (!dare || d.id !== dare.id));
  dare = pool.length ? pool[Math.floor(Math.random() * pool.length)] : (dares.filter(d => dareOpen(d, done, sk))[0] || null);
  keepDare();
  renderDare();
}
// "Give me another one": the dare you skip does not come back tonight
function skipDare(){
  if (!dare) return;
  const sk = skipped(); sk.add(dare.id); store.set(skipKey(), JSON.stringify([...sk]));
  const done = myDone();
  const left = dares.filter(d => dareOpen(d, done, sk)).length;
  pickDare();
  toast(t(left ? 'skipWarn' : 'skipNone', { n: left }));
}

}

/* ---------- photos: shrink on the phone before upload ---------- */
function shrink(file, max = 1200, q = 0.72){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
async function upload(blob){
  const path = night + '/' + user.id + '/' + crypto.randomUUID() + '.jpg';
  const { error } = await sb.storage.from('night-photos').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '3600' });
  if (error) throw error;
  return path;
}
const signed = new Map();
async function signAll(paths){
  const need = paths.filter(p => p && !signed.has(p));
  if (!need.length) return;
  const { data } = await sb.storage.from('night-photos').createSignedUrls(need, 6 * 3600);
  (data || []).forEach(r => { if (r.signedUrl) signed.set(r.path, r.signedUrl); else signed.set(r.path, ''); });
}

/* ---------- saving photos to the phone's gallery ----------
   iPhone: the share sheet's "Save Image" puts photos in Photos (a download only lands in Files).
   Phones only open the share sheet straight after a tap, so the files are fetched before the tap.
   Without a share sheet: press and hold the photo → "Save to Photos" / "Download image". */
const files = new Map();
const livePhotos = () => msgs.filter(m => m.photo_path && !m.deleted && !photoExpired(m) && signed.get(m.photo_path));
async function fileFor(path, i){
  if (files.has(path)) return files.get(path);
  const r = await fetch(signed.get(path)); if (!r.ok) throw new Error('photo');
  const b = await r.blob();
  const slug = (info.name || 'streetdare').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'streetdare';
  const f = new File([b], 'streetdare-' + slug + '-' + (i + 1) + '.jpg', { type: 'image/jpeg' });
  files.set(path, f); return f;
}
const canShareFiles = fs => { try{ return !!(navigator.canShare && navigator.share && navigator.canShare({ files: fs })); }catch(e){ return false; } };
let prepping = false;
async function prepPhotos(){

    $('cText').value = ''; $('cText').style.height = 'auto'; replyTo = null; $('cReply').hidden = true; chatBlob = null; $('cFile').value = ''; $('cPreview').hidden = true;
    await refreshNow(); scrollChat(true); markRead();
  }catch(x){ toast(t('err')); }
  finally{ b.disabled = false; }
};

/* ---------- live updates ---------- */
let refT, chan;
async function refreshNow(){
  const before = msgs.length ? msgTime(msgs[msgs.length - 1]) : 0;
  const { data } = await sb.rpc('night_info', { p_night: night });
  if (data){ info = data; }
  /* the host may have switched the group language: every phone follows */
  const langSwitch = info && info.lang && T[info.lang] && L !== info.lang;
  if (langSwitch) L = info.lang;
  await loadMsgs();
  if (langSwitch) paint(); else renderNight();
  const newest = msgs.length ? msgs[msgs.length - 1] : null;
  if (newest && msgTime(newest) > before && newest.profile_id !== user.id && tab === 'chat'){
    const box = $('chatList');
    if (box.scrollHeight - box.scrollTop - box.clientHeight > 140){ $('newBelow').textContent = t('newMsgs'); $('newBelow').hidden = false; }
    else markRead();
  }
}
function refresh(){ clearTimeout(refT); refT = setTimeout(refreshNow, 250); }
function startRealtime(){
  if (chan) return;
  const f = 'night_id=eq.' + night;
  chan = sb.channel('night-' + night)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'night_messages', filter: f }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'night_plays', filter: f }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'night_members', filter: f }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'nights', filter: 'id=eq.' + night }, refresh)
    .subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ refresh(); markRead(); } else paintBadge(); });
}
</script>
