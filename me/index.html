<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREETDARE · My shirt</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="../fonts/caprasimo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<script src="/js/night.js"></script>
<style>
.me{padding:6px 0 70px}
.me h1{font-size:clamp(2.2rem,10vw,3rem);color:var(--red);transform:rotate(-2deg);margin:10px 0 6px}
.panel{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:18px;margin:18px 0;box-shadow:var(--sh)}
.panel h2{font-family:"Caprasimo","Bookman Old Style",Georgia,serif;font-weight:400;font-size:1.5rem;margin-bottom:6px}
.panel .sub{margin-bottom:14px;font-size:.95rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.tile{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-family:"Caprasimo","Bookman Old Style",Georgia,serif;font-weight:400;font-size:1.8rem;line-height:1.05}
.tile span{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.feed{list-style:none;padding:0;margin:10px 0 0;max-height:300px;overflow:auto}
.feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eadfd2;font-size:.92rem}
.feed time{color:var(--mute);min-width:62px;font-size:.82rem;padding-top:2px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;color:#1d7a43;vertical-align:middle;margin-left:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#1d7a43;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.linkrow{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 8px 8px 12px;font-size:.92rem;margin-top:12px}
.linkrow code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;font-weight:600}
.mini{font:700 .85rem "DM Sans",sans-serif;border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:7px 13px;cursor:pointer;color:var(--ink);white-space:nowrap;text-decoration:none}
.mini.red{background:var(--red);color:#fff}
.mini.plain{border-color:transparent;background:none;text-decoration:underline;color:var(--mute);padding:7px 6px}
.mini:disabled{opacity:.5;cursor:default}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label,.lbl{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.at{display:flex;align-items:center;gap:0;background:#fff;border:2px solid var(--ink);border-radius:14px;padding-left:14px;color:var(--ink)}
.at span{font-weight:700}
.field .at input,.at input{border:0!important;border-radius:14px;padding-left:4px!important;width:100%;font:500 1rem "DM Sans",sans-serif;padding:12px 14px 12px 4px;background:transparent;color:var(--ink);outline:none}
.field input,.field textarea,.field select,.claim input{width:100%;font:500 1rem "DM Sans",sans-serif;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:52px}
.field small{color:var(--mute);font-size:.85rem}
.claim{display:grid;gap:12px}
.codebox{display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:0 14px}
.codebox span{font:700 1.2rem "DM Sans",sans-serif;letter-spacing:.12em;color:var(--ink);user-select:none}
.claim .codebox input{border:0;border-radius:0;background:transparent;padding:12px 0;width:7.4em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:left;font-size:1.2rem;outline:none}
.codebox:focus-within{box-shadow:0 0 0 3px var(--blush,#f6ddd3)}
html.night .codebox{background:#2a2422}html.night .codebox span{color:var(--ink)}
.dare{border-top:1.5px solid #eadfd2;padding:12px 0;display:grid;gap:8px}
.dare:first-child{border-top:0}
.dare p{font-weight:600}
.dare p small{display:block;font-weight:400;color:var(--mute)}
.dare.off p{opacity:.45}
.dare .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--red)}
.flag{font-size:.8rem;color:var(--red);font-weight:700}
.deck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1.5px solid #eadfd2}
.deck:first-child{border-top:0}
.deck b{display:block}
.deck small{color:var(--mute)}
.pill{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 10px;background:#d9f0e2;color:#1d7a43;white-space:nowrap}
.pill.soon{background:var(--blush);color:var(--red)}
.err{color:var(--red);font-weight:600;font-size:.9rem}
.ok{color:#1d7a43;font-weight:600;font-size:.9rem}
.shirtpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shirtpick button{border:2px solid var(--ink);border-radius:99px;background:#fff;padding:6px 14px;font-weight:700;cursor:pointer}
.shirtpick button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:9;max-width:90vw;text-align:center}
.danger{color:var(--mute);font-size:.88rem;margin-top:8px}
.loading{text-align:center;color:var(--mute);padding:60px 0}
.nudge{background:var(--red);color:#fff;border-color:var(--ink)}
.nudge .sub{color:#fff;opacity:.95}
.nudge .btn{background:#fff;color:var(--ink)}
.photorow{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avview{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.avview[hidden]{display:none}
.avview img{width:min(78vw,420px);height:min(78vw,420px);border-radius:50%;object-fit:cover;border:5px solid #fff;background:#222}
.avview .vx{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#1b1412;font-size:1.1rem;font-weight:800;cursor:pointer}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);background:var(--blush);flex:none;display:grid;place-items:center;font-size:2rem}
.photorow .acts{display:flex;gap:8px;flex-wrap:wrap}
.setup{background:var(--card)}
.setup .bar{height:8px;border-radius:99px;background:#eadfd2;overflow:hidden;margin:2px 0 14px}
.setup .bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1.5px solid #eadfd2;color:var(--ink)}
.steps li:first-child{border-top:0}
.steps li b{display:block;font-size:1rem}
.steps li small{display:block;color:var(--mute);font-size:.88rem;margin-top:2px;line-height:1.35}
.steps .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.8rem;background:#fff}
.steps li.done .ck{background:#1d7a43;border-color:#1d7a43;color:#fff}
.steps li.done b{color:var(--mute);font-weight:600;text-decoration:line-through;text-decoration-thickness:1.5px}
.steps li.done small{display:none}
.steps .mini{margin-top:8px;display:inline-block}
.codeedit input::placeholder{font:500 1rem "DM Sans",sans-serif;letter-spacing:.05em;color:var(--mute)}
.guide details{border-top:1.5px solid #eadfd2;padding:10px 0}
.guide details:first-of-type{border-top:0}
.guide summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.guide summary::after{content:"+";font-weight:800;color:var(--red)}
.guide details[open] summary::after{content:"–"}
.guide details p{margin:8px 0 0;font-size:.95rem;color:var(--ink)}
.codeedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codeedit input{width:120px;font:400 1.6rem "Caprasimo","Bookman Old Style",Georgia,serif;letter-spacing:.25em;text-align:center;padding:8px 6px 4px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.code{font:400 2.6rem/1 "Caprasimo","Bookman Old Style",Georgia,serif;letter-spacing:.3em;text-align:center;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:16px 8px 12px;margin:6px 0 12px}
/* night mode */
html.night .tile,html.night .linkrow,html.night .at,html.night .shirtpick button,html.night .steps .ck,html.night .code,html.night .codeedit input,
html.night .field input,html.night .field textarea,html.night .field select,html.night .claim input{background:#2a2422;color:var(--ink)}
html.night .claim .codebox input{background:transparent}
html.night .shirtpick button.on{background:var(--ink);color:#121012}
html.night .steps li.done .ck{background:#1d7a43;color:#fff}
html.night .pill{background:#173826;color:#8fe0ad}
html.night .nudge .btn{background:#fff;color:#1b1412}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark display" href="../" aria-label="STREETDARE">STREETD<i class="sdstar" aria-hidden="true"></i>RE</a>
    <div class="right">
      <button class="lang" id="lang" aria-label="Language">ES</button>
    </div>
  </header>

  <main class="me">
    <p class="loading" id="loading">…</p>

    <div id="app" hidden>
      <div class="kicker" id="hello"></div>
      <h1 class="display" id="title"></h1>
      <p class="sub" id="adminLink" hidden><a href="../admin/">→ Admin board</a></p>
      <p class="sub"><a href="/pass/" id="passLink">🎟️ Shirtless Pass →</a></p>

      <!-- set-up checklist for new owners -->
      <!-- right after the profile is created: is this the name people should see? -->
      <section class="panel nudge" id="nameCheck" hidden>
        <h2 id="ncH"></h2>
        <p class="sub" id="ncP"></p>
        <form id="ncForm" class="field" style="margin:0">
          <input id="ncName" maxlength="40" required>
          <button class="btn" type="submit" id="ncBtn" style="margin-top:6px"></button>
        </form>
      </section>

      <!-- everyone picks a unique username -->
      <section class="panel nudge" id="userCheck" hidden>
        <h2 id="ucH"></h2>
        <p class="sub" id="ucP"></p>
        <form id="ucForm" class="field" style="margin:0">
          <div class="at"><span>@</span><input id="ucIn" maxlength="20" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" required></div>
          <p class="sub" id="ucMsg" style="margin:6px 0 0;font-size:.9rem"></p>
          <button class="btn" type="submit" id="ucBtn" style="margin-top:6px"></button>
        </form>
      </section>

      <!-- where the owner lives now: picked by them -->
      <section class="panel nudge" id="ctryCheck" hidden>
        <h2 id="ccH"></h2>
        <p class="sub" id="ccP"></p>
        <form id="ccForm" class="field" style="margin:0">
          <select id="ccSel" required></select>
          <button class="btn" type="submit" id="ccBtn" style="margin-top:6px"></button>
        </form>
      </section>

      <section class="panel setup" id="setup" hidden>
        <h2 id="setupH"></h2>
        <p class="sub" id="setupP"></p>
        <div class="bar"><i id="setupBar"></i></div>
        <ol class="steps" id="steps"></ol>
      </section>

      <!-- the person -->
      <section class="panel">
        <h2 id="profH"></h2>
        <p class="sub" id="profP"></p>
        <div class="photorow">
          <img class="avatar" id="avatar" alt="" hidden style="cursor:zoom-in"><div class="avatar" id="avatarEmpty">🙂</div>
          <div class="acts"><button class="mini red" type="button" id="photoBtn"></button><button class="mini plain" type="button" id="photoDel" hidden></button></div>
          <input type="file" id="photoFile" accept="image/*" hidden>
        </div>
        <form id="profForm">
          <div class="field"><label for="pName" id="pNameL"></label><input id="pName" maxlength="40" required><small id="pNameS"></small></div>
          <div class="field"><label for="pUser" id="pUserL"></label><div class="at"><span>@</span><input id="pUser" maxlength="20" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"></div></div>
          <div class="field"><label for="pCtry" id="pCtryL"></label><select id="pCtry"></select></div>
          <div class="field"><label for="pIg" id="pIgL"></label><input id="pIg" maxlength="31" autocapitalize="off" autocorrect="off" placeholder="@"></div>
          <label class="tog" style="margin-bottom:10px"><input type="checkbox" id="pIgPub"><span id="pIgPubL"></span></label>
          <label class="tog" style="margin-bottom:4px"><input type="checkbox" id="pMkt"><span id="pMktL"></span></label>
          <p class="sub" id="pMktN" style="font-size:.82rem;margin:0 0 14px"></p>
          <label class="tog" id="recap" style="margin-bottom:4px"><input type="checkbox" id="pRecap"><span id="pRecapL"></span></label>
          <p class="sub" id="pRecapN" style="font-size:.82rem;margin:0 0 14px"></p>
          <p class="err" id="profErr" hidden></p>
          <button class="btn red" type="submit" id="profBtn"></button>
        </form>
      </section>

      <!-- no shirt yet -->
      <section class="panel" id="p-claim" hidden>
        <h2 id="claimH"></h2>
        <p class="sub" id="claimP"></p>
        <form class="claim" id="claimForm">
          <label class="codebox" for="claimCode"><span aria-hidden="true">DARE-</span><input id="claimCode" maxlength="11" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXXXX" aria-label="DARE-XXXXXX"></label>
          <p class="err" id="claimErr" hidden></p>
          <button class="btn red" type="submit" id="claimBtn"></button>
        </form>
        <p class="sub" style="margin:16px 0 0;font-size:.9rem" id="noShirt"></p>
      </section>

      <div id="shirtArea" hidden>
        <h2 class="display" id="shirtsH" style="font-size:1.6rem;margin:26px 0 0"></h2>
        <div class="shirtpick" id="shirtPick"></div>


        <!-- dare code -->
        <section class="panel">
          <h2 id="codeH"></h2>
          <p class="sub" id="codeP"></p>
          <div class="code" id="codeVal">····</div>
          <form class="codeedit" id="codeForm">
            <input id="codeIn" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234" aria-label="Code">
            <button class="mini red" type="submit" id="codeSave"></button>
            <button class="mini plain" type="button" id="newCode"></button>
          </form>
        </section>

        <!-- stats + live -->
        <section class="panel">
          <h2><span id="statsH"></span><span class="live" id="liveDot" hidden><i></i><span id="liveTxt"></span></span></h2>
          <div class="tiles">
            <div class="tile"><b id="nScans">0</b><span id="lScans"></span></div>
            <div class="tile"><b id="nPeople">0</b><span id="lPeople"></span></div>
            <div class="tile"><b id="nDone">0</b><span id="lDone"></span></div>
          </div>
          <ul class="feed" id="feed"></ul>
          <div class="linkrow"><code id="qrLink"></code><button class="mini" id="copyLink"></button><a class="mini" id="openLink" target="_blank" rel="noopener"></a></div>
        </section>

        <!-- my dares -->
        <section class="panel">
          <h2 id="daresH"></h2>
          <p class="sub" id="daresP"></p>
          <div id="myDares"></div>
          <form id="dareForm" style="margin-top:14px">
            <div class="field"><label for="dEn" id="dEnL"></label><textarea id="dEn" rows="2" maxlength="300"></textarea></div>
            <div class="field"><label for="dEs" id="dEsL"></label><textarea id="dEs" rows="2" maxlength="300"></textarea></div>
            <p class="err" id="dareErr" hidden></p>
            <button class="btn red" type="submit" id="dareBtn"></button>
          </form>
        </section>

        <!-- how it works -->
        <section class="panel guide">
          <h2 id="guideH"></h2>
          <div id="guide"></div>
        </section>

        <!-- decks -->
        <section class="panel">
          <h2 id="decksH"></h2>
          <p class="sub" id="decksP"></p>
          <div id="deckList"></div>
        </section>

      </div>

      <!-- account -->
      <section class="panel">
        <h2 id="accH"></h2>
        <p class="sub" id="accEmail"></p>
        <div class="stack">
          <button class="btn" id="logout"></button>
        </div>
        <p class="danger"><button class="mini plain" id="delAcc"></button></p>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="../js/geo.js"></script>
<script src="/js/copy.js"></script>

let L = lang(), user = null, profile = null, shirts = [], shirt = null, decks = [], interest = new Set(), events = [], channel = null;
const t = k => ((T[L] || {})[k] ?? T.en[k]);
/* wording Aron has approved in /admin -> Copy wins over the text above */
if (window.sdCopy) sdCopy(T, 'me', () => { try { paint(); } catch (e) {} });
let toastT; function toast(m){ $('toast').textContent = m; $('toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('toast').hidden = true, 2600); }
const when = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return { es:'ahora', hu:'most' }[L] || 'now'; if (s < 3600) return Math.floor(s/60) + ' min'; if (s < 86400) return Math.floor(s/3600) + ' h'; return new Date(d).toLocaleDateString({ es:'es-ES', hu:'hu-HU' }[L] || 'en-GB', { day:'numeric', month:'short' }); };

/* ===== text ===== */
function paint(){
  document.documentElement.lang = L;
  if (window.paintLangPick) window.paintLangPick();
  const name = (profile && profile.name) || '';
  $('hello').textContent = name ? t('hello').replace('{n}', name) : '';
  $('title').textContent = t('title');
  ['claimH','claimP','statsH','daresH','daresP','decksH','decksP','profH','accH','codeH','codeP','newCode','setupH','setupP','profP','shirtsH','ncH','ncP','ncBtn','ccH','ccP','ccBtn','ucH','ucP','ucBtn','codeSave','guideH'].forEach(k => { if ($(k)) $(k).textContent = t(k); });
  $('claimBtn').textContent = t('claimBtn'); $('noShirt').innerHTML = t('noShirt');
  $('liveTxt').textContent = t('live'); $('lScans').textContent = t('scans'); $('lPeople').textContent = t('people'); $('lDone').textContent = t('done');
  $('copyLink').textContent = t('copy'); $('openLink').textContent = t('open');
  $('dEnL').textContent = t('enL'); $('dEsL').textContent = t('esL'); $('dareBtn').textContent = t('addDare');
  $('pMktL').textContent = t('mktL'); $('pMktN').innerHTML = t('mktN'); $('pRecapL').textContent = t('recapL'); $('pRecapN').textContent = t('recapN');
  $('guide').innerHTML = t('g').map(x => '<details><summary>' + esc(x[0]) + '</summary><p>' + esc(x[1]) + '</p></details>').join('');
  $('pCtryL').textContent = t('ctryL'); $('pUserL').textContent = t('userL'); $('pNameL').textContent = t('nameL'); $('pNameS').textContent = t('nameS'); $('pIgL').textContent = t('igL'); $('pIgPubL').textContent = t('igPubL'); $('profBtn').textContent = t('saveProf');
  $('accEmail').textContent = user ? t('loggedAs').replace('{e}', user.email) : '';
  $('logout').textContent = t('logout'); $('delAcc').textContent = t('del2');
  paintProfile(); paintNameCheck(); paintUser(); paintCountry(); saveLang();
  if (shirt){ paintStats(); paintDares(); paintDecks(); }
  liftSetup(); paintSetup();
}
window.paintLangPick = langPicker($('lang'), () => L, code => { L = code; setLang(L); paint(); });

/* ===== start ===== */
(async () => {
  const session = await getSession();
  if (!session){ const go = (location.hash.match(/^#(emails|recap)$/) || [])[1]; location.replace('/login/?next=' + encodeURIComponent('/me/' + (go ? '?go=' + go : ''))); return; }
  /* No live-night takeover here: someone who taps "Profile" wants the profile.
     The live-group bar at the top of the page is the way back into the night. */
  user = session.user;
  const [p, d, i] = await Promise.all([
    sb.from('profiles').select('name, role, avatar_url, instagram, instagram_public, marketing_opt_in, name_confirmed, country, country_confirmed, username, recap_opt_in, lang, setup_done').eq('id', user.id).maybeSingle(),
    sb.from('decks').select('id,name_en,name_es,name_hu,is_free,active,sort').order('sort'),
    sb.from('pack_interest').select('deck_id')
  ]);
  profile = p.data || {}; decks = d.data || []; interest = new Set((i.data || []).map(r => r.deck_id));
  $('adminLink').hidden = profile.role !== 'admin';
  try{ if (profile.avatar_url) localStorage.setItem('sd_avatar', profile.avatar_url); else localStorage.removeItem('sd_avatar'); }catch(e){}
  await loadShirts();
  $('loading').hidden = true; $('app').hidden = false;
})();

async function loadShirts(pick){
  const { data } = await sb.from('shirts').select('id,name,status').eq('owner_id', user.id).order('created_at');
  shirts = data || [];
  $('p-claim').hidden = !!shirts.length; $('shirtArea').hidden = !shirts.length;
  $('shirtPick').innerHTML = shirts.map(s => '<button data-id="' + esc(s.id) + '">👕 ' + esc(s.id) + '</button>').join('') + '<button type="button" id="claimMore">+ ' + esc(t('addClaim')) + '</button>';
  $('claimMore').onclick = () => { $('p-claim').hidden = false; $('p-claim').scrollIntoView({ behavior:'smooth' }); };
  $('shirtPick').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => selectShirt(b.dataset.id));
  if (shirts.length) await selectShirt(pick || shirts[0].id); else paint();
}

async function selectShirt(id){
  shirt = shirts.find(s => s.id === id);
  $('shirtPick').querySelectorAll('button[data-id]').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  const url = 'https://streetdare.com/p/?s=' + shirt.id;
  $('qrLink').textContent = url.replace('https://',''); $('openLink').href = url;
  const { data } = await sb.from('play_events').select('event,device_id,dare_text,created_at').eq('shirt_id', shirt.id).order('created_at', { ascending:false }).limit(1000);
  events = data || [];
  await Promise.all([loadDares(), loadCode()]);
  startLive();
  paint();
}

/* ===== stats + live ===== */
function paintStats(){
  $('nScans').textContent = events.filter(e => e.event === 'scan').length;
  $('nPeople').textContent = new Set(events.map(e => e.device_id).filter(Boolean)).size;
  $('nDone').textContent = events.filter(e => e.event === 'done').length;
  const f = events.slice(0, 25);
  $('feed').innerHTML = f.length ? f.map(e => '<li><time>' + when(e.created_at) + '</time><span>' + t('ev_' + e.event) + (e.dare_text && e.event !== 'spin' ? '<br><small style="color:var(--mute)">' + esc(e.dare_text) + '</small>' : '') + '</span></li>').join('')
    : '<li style="color:var(--mute)">' + t('feedEmpty') + '</li>';
}
function startLive(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('me-' + shirt.id)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'play_events', filter:'shirt_id=eq.' + shirt.id }, p => {
      events.unshift(p.new); paintStats(); paintSetup();
      if (p.new.event === 'scan' && navigator.vibrate) navigator.vibrate(60);
    })
    .subscribe(s => { $('liveDot').hidden = s !== 'SUBSCRIBED'; });
}
$('copyLink').onclick = async () => { try{ await navigator.clipboard.writeText('https://' + $('qrLink').textContent); toast(t('copied')); }catch(e){} };

/* "DARE-" is printed in front of the field and never typed; a pasted "DARE-AB12CD" is trimmed to "AB12CD" */
const cleanCode = v => String(v || '').toUpperCase().replace(/^\s*DARE[-\s]?/, '').replace(/[^A-Z0-9]/g, '').slice(0, 6);
$('claimCode').addEventListener('input', e => { const el = e.target, c = cleanCode(el.value); if (el.value !== c) el.value = c; });
$('claimForm').onsubmit = async e => {
  e.preventDefault(); $('claimErr').hidden = true;
  const code = cleanCode($('claimCode').value);
  if (code.length < 6) return;
  const b = $('claimBtn'); b.disabled = true; b.textContent = t('claiming');
  const { data, error } = await sb.rpc('claim_shirt', { p_code: 'DARE-' + code });
  b.disabled = false; b.textContent = t('claimBtn');
  if (error){ $('claimErr').textContent = t('claimBad'); $('claimErr').hidden = false; return; }

/* ===== my dares ===== */
let myDares = [];
async function loadDares(){
  const { data } = await sb.from('dares').select('id,text_en,text_es,text_hu,active,hidden_by_admin').eq('shirt_id', shirt.id).order('sort').order('id');
  myDares = data || [];
}
function paintDares(){
  const main = r => L === 'es' ? r.text_es : L === 'hu' ? (r.text_hu || r.text_en) : r.text_en, other = r => L === 'en' ? r.text_es : r.text_en;
  $('myDares').innerHTML = myDares.length ? myDares.map(r =>
    '<div class="dare' + (r.active && !r.hidden_by_admin ? '' : ' off') + '" data-id="' + r.id + '">' +
      '<p>' + esc(main(r)) + (other(r) !== main(r) ? '<small>' + esc(other(r)) + '</small>' : '') + '</p>' +
      (r.hidden_by_admin ? '<span class="flag">' + t('hidden') + '</span>' :
      '<div class="acts"><label class="tog"><input type="checkbox" name="active"' + (r.active ? ' checked' : '') + '>' + t('liveL') + '</label>' +
      '<button class="mini plain" name="edit">' + t('edit') + '</button><button class="mini plain" name="del">' + t('del') + '</button></div>') +
    '</div>').join('') : '<p class="sub" style="margin:0">' + t('daresEmpty') + '</p>';
  $('dareForm').hidden = myDares.length >= 10;
  if (myDares.length >= 10){ $('myDares').insertAdjacentHTML('beforeend', '<p class="sub" style="margin:10px 0 0">' + t('limit') + '</p>'); }
  $('myDares').querySelectorAll('.dare').forEach(row => {
    const id = Number(row.dataset.id), r = myDares.find(x => x.id === id);
    const act = row.querySelector('[name=active]'); if (!act) return;
    act.onchange = async () => { const { error } = await sb.from('dares').update({ active: act.checked }).eq('id', id); if (error) return toast(t('err')); r.active = act.checked; paintDares(); };
    row.querySelector('[name=del]').onclick = async () => { if (!confirm(t('delSure'))) return; const { error } = await sb.from('dares').delete().eq('id', id); if (error) return toast(t('err')); await loadDares(); paintDares(); };
    row.querySelector('[name=edit]').onclick = () => {
      row.innerHTML = '<div class="field"><label>' + t('enL') + '</label><textarea name="a" rows="2" maxlength="300">' + esc(main(r)) + '</textarea></div>' +
        '<div class="field"><label>' + t('esL') + '</label><textarea name="b" rows="2" maxlength="300">' + esc(other(r) === main(r) ? '' : other(r)) + '</textarea></div>' +
        '<div class="acts"><button class="mini red" name="save">' + t('save') + '</button></div>';
      row.querySelector('[name=save]').onclick = async () => {
        const a = row.querySelector('[name=a]').value.trim(), b = row.querySelector('[name=b]').value.trim() || a;
        if (a.length < 4) return toast(t('tooShort'));
        const upd = L === 'es' ? { text_es: a, text_en: b } : L === 'hu' ? { text_hu: a, text_en: b, text_es: b } : { text_en: a, text_es: b };
        const { error } = await sb.from('dares').update(upd).eq('id', id); if (error) return toast(t('err'));
        await loadDares(); paintDares(); toast(t('saved'));
      };
    };
  });
}
$('dareForm').onsubmit = async e => {
  e.preventDefault(); $('dareErr').hidden = true;
  const a = $('dEn').value.trim().replace(/\s+/g,' '), b = $('dEs').value.trim().replace(/\s+/g,' ') || a;
  if (a.length < 4){ $('dareErr').textContent = t('tooShort'); $('dareErr').hidden = false; return; }
  const row = L === 'es' ? { text_es: a, text_en: b } : L === 'hu' ? { text_hu: a, text_en: b, text_es: b } : { text_en: a, text_es: b };
  const { error } = await sb.from('dares').insert(Object.assign({ shirt_id: shirt.id, sort: myDares.length }, row));
  if (error){ $('dareErr').textContent = (error.message || '').includes('dare_limit') ? t('limit') : t('err'); $('dareErr').hidden = false; return; }
  $('dEn').value = ''; $('dEs').value = ''; toast(t('added')); await loadDares(); paintDares();
};

/* ===== decks ===== */
let picked = new Set(), pickedFor = null;
async function loadPicked(){
  pickedFor = shirt.id;
  const { data } = await sb.from('shirt_decks').select('deck_id').eq('shirt_id', shirt.id);
  picked = new Set((data || []).map(r => r.deck_id)); paintDecks();
}
function paintDecks(){
  if (!shirt) return;
  if (pickedFor !== shirt.id){ loadPicked(); return; }
  const paid = decks.filter(d => !d.is_free), full = picked.size >= 2;
  /* A pack can only be picked once it is switched on and actually has dares in it. Choosing is
     final, so offering an empty deck would lock an owner into nothing. While none of the paid
     packs is ready, the rows still show with "Coming soon" and the "I want this" button, and the
     "x of 2 chosen" line stays off the screen entirely. */
  const anyReady = paid.some(d => d.active);
  $('decksP').textContent = t('decksP') + ((anyReady || picked.size)
    ? ' ' + (full ? t('pickDone') : t('pickInfo').replace('{n}', picked.size))
    : '');
  const dn = d => (L === 'es' ? d.name_es : L === 'hu' ? d.name_hu : d.name_en) || d.name_en;
  /* Devil mode is a switch inside the Party deck, not something you pick separately */
  $('deckList').innerHTML = decks.filter(d => d.id !== 'spicy' && ((d.is_free && d.active) || !d.is_free)).map(d => {
    const name = dn(d);
    let right;
    if (d.is_free) right = '<span class="pill">' + t('included') + '</span>';
    else if (picked.has(d.id)) right = '<span class="pill">' + t('picked') + '</span>';
    else if (!full && d.active) right = '<button class="mini red" data-pick="' + d.id + '">' + t('pickBtn') + '</button>';
    else right = interest.has(d.id) ? '<span class="pill soon">' + t('wanted') + '</span>' : '<button class="mini" data-want="' + d.id + '">' + t('want') + '</button>';
    return '<div class="deck"><div><b>' + esc(name) + '</b>' + (!d.is_free && !d.active ? '<small>' + t('soon') + '</small>' : '') + '</div>' + right + '</div>';
  }).join('');
  $('deckList').querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    const d = decks.find(x => x.id === b.dataset.pick);
    if (!confirm(t('pickQ').replace('{deck}', dn(d)))) return;
    b.disabled = true;
    const { data, error } = await sb.rpc('choose_shirt_decks', { p_shirt: shirt.id, p_decks: [d.id] });
    if (error || (data !== 'ok' && data !== 'nothing')){ b.disabled = false; return toast(t('pickErr')); }
    picked.add(d.id); paintDecks();
  });
  bindWant();
}
function paintDecksOld(){
  $('deckList').innerHTML = decks.map(d => {
    const name = (L === 'es' ? d.name_es : L === 'hu' ? d.name_hu : d.name_en) || d.name_en, inc = d.is_free && d.active;
    return '<div class="deck"><div><b>' + esc(name) + '</b></div>' + (inc ? '<span class="pill">' + t('included') + '</span>'
      : (interest.has(d.id) ? '<span class="pill soon">' + t('wanted') + '</span>' : '<button class="mini" data-want="' + d.id + '">' + t('want') + '</button>')) + '</div>';
  }).join('');
  $('deckList').querySelectorAll('[data-want]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from('pack_interest').insert({ deck_id: b.dataset.want });
    if (error && error.code !== '23505'){ b.disabled = false; return toast(t('err')); }
    interest.add(b.dataset.want); paintDecks();
  });
}
function bindWant(){
  $('deckList').querySelectorAll('[data-want]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from('pack_interest').insert({ deck_id: b.dataset.want });
    if (error && error.code !== '23505'){ b.disabled = false; return toast(t('err')); }
    interest.add(b.dataset.want); paintDecks();
  });
}

/* ===== profile on the shirt ===== */

  if (upd.marketing_opt_in !== !!profile.marketing_opt_in) upd.marketing_opt_in_at = new Date().toISOString();

};

/* ===== set-up checklist (shown until all four steps are done) ===== */
/* The ticks live on the account (profiles.setup_done), so a new phone or browser
   doesn't ask you to set the shirt up all over again. localStorage is only a fallback
   for the moment between the tap and the database answering. */
const seen = k => {
  if (profile && Array.isArray(profile.setup_done) && profile.setup_done.includes(k)) return true;
  try{ return localStorage.getItem('sd_setup_' + k) === '1'; }catch(e){ return false; }
};
function mark(k){
  try{ localStorage.setItem('sd_setup_' + k, '1'); }catch(e){}
  if (!profile) return;
  const list = Array.isArray(profile.setup_done) ? profile.setup_done : [];
  if (list.includes(k)) return;
  profile.setup_done = [...list, k];
  sb.from('profiles').update({ setup_done: profile.setup_done }).eq('id', user.id);
}
/* anything already ticked in this browser moves up to the account once */
function liftSetup(){
  if (!profile) return;
  const list = Array.isArray(profile.setup_done) ? profile.setup_done : [];
  const add = ['code','test'].filter(k => !list.includes(k) && (() => { try{ return localStorage.getItem('sd_setup_' + k) === '1'; }catch(e){ return false; } })());
  if (!add.length) return;
  profile.setup_done = [...list, ...add];
  sb.from('profiles').update({ setup_done: profile.setup_done }).eq('id', user.id);
}
function paintSetup(){
  if (!shirt){ $('setup').hidden = true; return; }
  const done = { st1: !!(profile && profile.avatar_url), st2: seen('code'), st3: seen('test'), st4: events.some(e => e.event === 'scan') };
  const n = Object.values(done).filter(Boolean).length;
  $('setup').hidden = n === 4;
  $('setupBar').style.width = (n / 4 * 100) + '%';
  $('setupP').textContent = t('setupDone').replace('{n}', n) + ' · ' + t('setupP');
  const btn = { st1:'<button class="mini" data-do="photo">' + t('st1b') + '</button>', st2:'<button class="mini" data-do="code">' + t('st2b') + '</button>',
                st3:'<a class="mini" data-do="test" target="_blank" rel="noopener" href="/p/?s=' + encodeURIComponent(shirt.id) + '">' + t('st3b') + '</a>', st4:'' };
  $('steps').innerHTML = ['st1','st2','st3','st4'].map((k, i) => '<li class="' + (done[k] ? 'done' : '') + '"><span class="ck">' + (done[k] ? '✓' : i + 1) + '</span><div><b>' + t(k) + '</b><small>' + t(k + 's') + '</small>' + (done[k] ? '' : btn[k]) + '</div></li>').join('');
  $('steps').querySelectorAll('[data-do]').forEach(b => b.onclick = () => {
    const d = b.dataset.do;
    if (d === 'photo') return $('photoFile').click();
    if (d === 'code'){ mark('code'); $('codeVal').scrollIntoView({ behavior:'smooth', block:'center' }); }
    if (d === 'test') mark('test');
    setTimeout(paintSetup, 400);
  });
}
function squareJpeg(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), out = 640, c = document.createElement('canvas');
      c.width = c.height = out;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url); c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
$('photoFile').onchange = async () => {
  const f = $('photoFile').files[0]; $('photoFile').value = ''; if (!f) return;
  const b = $('photoBtn'); b.disabled = true; b.textContent = t('photoUp');
  try{
    const blob = await squareJpeg(f), path = user.id + '/' + Date.now() + '.jpg';
    const up = await sb.storage.from('avatars').upload(path, blob, { contentType:'image/jpeg', cacheControl:'31536000' });
    if (up.error) throw up.error;
    const old = profile.avatar_url, url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    const { error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', user.id);
    if (error) throw error;
    profile.avatar_url = url; toast(t('photoSaved'));
    if (old && old.includes('/avatars/')) sb.storage.from('avatars').remove([old.split('/avatars/')[1]]);
  }catch(e){ toast(t('photoBad')); }
  b.disabled = false; paint();
};
$('photoDel').onclick = async () => {
  const old = profile.avatar_url;
  const { error } = await sb.from('profiles').update({ avatar_url: null }).eq('id', user.id);
  if (error) return toast(t('err'));
  profile.avatar_url = null; paint();
  if (old && old.includes('/avatars/')) sb.storage.from('avatars').remove([old.split('/avatars/')[1]]);
};

/* ===== remember the owner's language for emails (morning recap) ===== */
function saveLang(){
  const go = location.hash.slice(1) || new URLSearchParams(location.search).get('go');
  if ((go === 'recap' || go === 'emails') && profile && !window._rc){ window._rc = 1; setTimeout(() => { const r = go === 'recap' ? $('recap') : $('pMkt').closest('label'), d = r.closest('details'); if (d) d.open = true; r.scrollIntoView({ block:'center' }); r.style.outline = '3px solid var(--red)'; r.style.borderRadius = '12px'; setTimeout(() => r.style.outline = '', 2600); }, 400); }
  if (!profile || !user || profile.lang === L || !['en','es','hu'].includes(L)) return;
  profile.lang = L; sb.from('profiles').update({ lang: L }).eq('id', user.id).then(() => {});
}

/* ===== unique username ===== */
const unErr = (e, u) => e.code === '23505' ? t('ucTaken').replace('{u}', u) : /username_blocked|username_format/.test(e.message || '') ? t('ucBlocked') : t('err');
const UN_RE = /^(?!.*\.\.)[a-z0-9][a-z0-9._]{1,18}[a-z0-9]$/;
function paintUser(){
  const show = !!profile && profile.name_confirmed && !profile.username;
  $('userCheck').hidden = !show;
  if (show && !$('ucIn').value){
    const base = (profile.name || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9._]/g, '').slice(0, 20);
    if (base.length >= 3){ $('ucIn').value = base; ucCheck(); }
  }
}
let ucTimer = null, ucOk = false;
async function ucCheck(){
  const u = $('ucIn').value.trim().toLowerCase(), m = $('ucMsg'); ucOk = false;
  if (!u){ m.textContent = ''; return; }
  if (!UN_RE.test(u)){ m.textContent = t('ucBad'); return; }
  const { data } = await sb.rpc('username_check', { p: u });
  if ($('ucIn').value.trim().toLowerCase() !== u) return;
  ucOk = data === 'ok'; m.textContent = t({ ok:'ucFree', taken:'ucTaken', blocked:'ucBlocked', bad:'ucBad' }[data] || 'err').replace('{u}', u);
}
$('ucIn').oninput = () => {
  const v = $('ucIn').value.toLowerCase().replace(/^@/, '').replace(/\s/g, '');
  if (v !== $('ucIn').value) $('ucIn').value = v;
  clearTimeout(ucTimer); ucTimer = setTimeout(ucCheck, 350);
};
$('ucForm').onsubmit = async e => {
  e.preventDefault();
  const u = $('ucIn').value.trim().toLowerCase();
  if (!UN_RE.test(u)){ $('ucMsg').textContent = t('ucBad'); return; }
  const { error } = await sb.from('profiles').update({ username: u }).eq('id', user.id);
  if (error){ $('ucMsg').textContent = unErr(error, u); return; }
  profile.username = u; $('pUser').value = u; toast(t('ucSaved')); paint();
};

  sel.value = keep || pick || '';
}
