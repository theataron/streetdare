<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREETDARE - your dare</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="STREETDARE">
<meta property="og:title" content="You just found a STREETDARE shirt 👀">
<meta property="og:description" content="Spin for a dare and do it together with the person in the shirt.">
<meta property="og:url" content="https://streetdare.com/p/">
<meta property="og:image" content="https://streetdare.com/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="STREETDARE - the shirt that makes the first move">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://streetdare.com/img/og.png">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="../fonts/caprasimo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/night.js"></script>
</head>
<body class="scanpage">
<div class="wrap">
  <header class="top" id="top">
    <a class="mark display" href="../" id="homeLogo" aria-label="STREETDARE">STREETD<i class="sdstar" aria-hidden="true"></i>RE</a>
    <div class="right">
      <button class="nightbtn" id="nightBtn" type="button" aria-label="Night mode">🌙</button>
      <button class="lang" id="lang" aria-label="Language">ES</button>
      <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i><span class="peek" aria-hidden="true">👀</span></button>
    </div>
  </header>

  <nav class="menu" id="menu" hidden>
    <button class="x" id="menuClose" aria-label="Close">✕</button>
    <a data-to="home"><span data-i18n="mHome"></span><small data-i18n="mHomeS"></small></a>
    <a href="#" id="mSpinLink"><span data-i18n="mSpin"></span><small data-i18n="mSpinS"></small></a>
    <a data-to="wall"><span data-i18n="mWall"></span><small data-i18n="mWallS"></small></a>
    <a data-to="about"><span data-i18n="mAbout"></span><small data-i18n="mAboutS"></small></a>
    <a data-to="club"><span data-i18n="mClub"></span><small data-i18n="mClubS"></small></a>
    <div class="foot">STREETDARE · Madrid · Budapest</div>
  </nav>

  <main>
    <!-- ===== SHIRT SWITCHED OFF (fair play): explains STREETDARE, then Shirtless Pass / own shirt ===== -->
    <section class="play offv" id="v-off" hidden>
      <div class="offhero" aria-hidden="true">
        <svg viewBox="0 0 300 140" class="a-shirt">
          <path class="tee" d="M70 30L95 18Q110 28 125 18L150 30 170 55 152 66 146 58V128H74V58L68 66 50 55Z"/>
          <g class="qr"><rect x="92" y="62" width="36" height="36" rx="2" class="qbg"/>
            <path d="M95 65h9v9h-9zM116 65h9v9h-9zM95 86h9v9h-9z" class="qd"/>
            <path d="M107 66h3v3h-3zM107 72h6v3h-6zM98 77h3v6h-3zM104 78h6v3h-6zM113 77h3v3h-3zM119 78h6v3h-6zM110 84h3v6h-3zM116 86h3v3h-3zM122 85h3v9h-3zM107 91h3v4h-3zM116 92h4v3h-4z" class="qd"/></g>
          <rect class="beam" x="88" y="60" width="44" height="3" rx="1.5"/>
          <g class="phone"><rect x="205" y="34" width="56" height="98" rx="10"/><rect x="211" y="46" width="44" height="74" rx="4" class="scr"/>
            <path class="pstar" d="M233 66l3.6 7.3 8 1.2-5.8 5.6 1.4 8-7.2-3.8-7.2 3.8 1.4-8-5.8-5.6 8-1.2z"/>
            <rect class="pl" x="218" y="96" width="30" height="4" rx="2"/><rect class="pl" x="222" y="104" width="22" height="4" rx="2"/></g>
        </svg>
        <span class="zz z1">z</span><span class="zz z2">z</span><span class="zz z3">Z</span>
      </div>
      <h1 class="display" id="offH"></h1>
      <p class="sub" id="offP"></p>
      <div class="offsteps">
        <div><b>📱</b><span id="offS1"></span></div>
        <div><b>🎰</b><span id="offS2"></span></div>
        <div><b>🤝</b><span id="offS3"></span></div>
      </div>
      <p class="offbreak" id="offP2"></p>
      <div class="offcards">
        <div class="cardx">
          <div class="art pass">
            <div class="guy">
              <img src="/img/shirtless-guy.webp" alt="" width="454" height="600">
              <svg viewBox="0 0 910 1202" class="a-guy" aria-hidden="true">
                <g class="lanyard"><path class="cord" d="M402 430L438 580M512 430L470 580"/>
                  <rect x="398" y="572" width="112" height="76" rx="12" class="badge"/><text x="454" y="625" class="bt">PASS</text></g>
                <path class="spark s1" d="M800 300l12 26 26 12-26 12-12 26-12-26-26-12 26-12z"/>
                <path class="spark s2" d="M110 380l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/>
              </svg>
            </div>
            <div class="lb"><div class="lbh" id="offLb"></div>
              <div class="lr"><span id="offYou"></span><i style="--w:92%;--d:0s"></i><b>7</b></div>
              <div class="lr"><span>Lena</span><i style="--w:70%;--d:.2s"></i><b>5</b></div>
              <div class="lr"><span>Marco</span><i style="--w:45%;--d:.4s"></i><b>3</b></div>
            </div>
          </div>
          <span class="tag live" id="offTag1"></span><h3 id="offC1h"></h3><p id="offC1p"></p>
          <a class="btn red" id="offBtn" href="/?home=1#shop"></a>
        </div>
        <div class="cardx">
          <div class="art tee"><svg viewBox="0 0 300 140" class="a-shirt" aria-hidden="true">
            <path class="tee tee-back" transform="translate(16 -4) rotate(7 110 73)" d="M70 30L95 18Q110 28 125 18L150 30 170 55 152 66 146 58V128H74V58L68 66 50 55Z"/>
            <path class="tee" d="M70 30L95 18Q110 28 125 18L150 30 170 55 152 66 146 58V128H74V58L68 66 50 55Z"/>
          <g class="qr"><rect x="92" y="62" width="36" height="36" rx="2" class="qbg"/>
            <path d="M95 65h9v9h-9zM116 65h9v9h-9zM95 86h9v9h-9z" class="qd"/>
            <path d="M107 66h3v3h-3zM107 72h6v3h-6zM98 77h3v6h-3zM104 78h6v3h-6zM113 77h3v3h-3zM119 78h6v3h-6zM110 84h3v6h-3zM116 86h3v3h-3zM122 85h3v9h-3zM107 91h3v4h-3zM116 92h4v3h-4z" class="qd"/></g>
          <rect class="beam" x="88" y="60" width="44" height="3" rx="1.5"/>
          <g class="phone"><rect x="205" y="34" width="56" height="98" rx="10"/><rect x="211" y="46" width="44" height="74" rx="4" class="scr"/>
            <path class="pstar" d="M233 66l3.6 7.3 8 1.2-5.8 5.6 1.4 8-7.2-3.8-7.2 3.8 1.4-8-5.8-5.6 8-1.2z"/>
            <rect class="pl" x="218" y="96" width="30" height="4" rx="2"/><rect class="pl" x="222" y="104" width="22" height="4" rx="2"/></g>
          </svg></div>
          <span class="tag" id="offTag2"></span><h3 id="offC2h"></h3><p id="offC2p"></p>
          <a class="btn red" id="offBtn2" href="/?home=1#join"></a>
        </div>
      </div>
    </section>
    <!-- ===== SPIN ===== -->
    <section class="play" id="v-spin" hidden>
      <a class="kicker" id="mineLink" href="/me/" hidden style="display:block;margin-bottom:10px;color:var(--ink);text-decoration:underline"></a>
      <div class="who">
        <img class="ownerpic" id="ownerPic" alt="" hidden role="button" tabindex="0">
        <div class="whotext"><div class="kicker" id="foundKicker"></div><h1 class="display" data-i18n="spinTitle"></h1></div>
      </div>
      <p class="sub" id="spinSub"></p>
      <div class="machine" id="machine">
        <div class="deck" id="deck">
          <div class="card back b2" aria-hidden="true"></div>
          <div class="card back b1" aria-hidden="true"></div>
          <div class="card front" id="front">
            <div class="lbl" data-i18n="unlocked"></div>
            <div class="reel q" id="reel" aria-live="polite">? ? ?</div>
            <span class="stamp" id="stamp" aria-hidden="true" data-i18n="stamp"></span>
            <span class="adult" id="adultTag" hidden>18+</span>
            <div class="byline" id="byFront" hidden></div>
          </div>
        </div>
        <div class="burst" id="burst" aria-hidden="true"></div>
      </div>
      <div class="how row" id="howRow">
        <div><b>1</b><span data-i18n="how1"></span></div>
        <div><b>2</b><span id="how2"></span></div>
        <div><b>3</b><span data-i18n="how3"></span></div>
      </div>
      <div class="stack" id="preSpin"><button class="btn red big" id="spinBtn" data-i18n="spin"></button></div>
      <div class="nextstep" id="together" hidden><b data-i18n="nextH"></b> <span id="nextP"></span></div>
      <div class="stack" id="postSpin" hidden>
        <button class="btn red" id="showBtn"></button>
        <button class="btn" id="againBtn" data-i18n="again"></button>
      </div>
      <label class="devil"><input type="checkbox" id="devil"><span data-i18n="devil"></span></label>
      <p class="devnote" id="devNote"></p>
    </section>

    <!-- ===== SHOW MODE: the scanner turns the phone around, the dare opens up big ===== -->
    <section class="play showmode" id="v-show" hidden>
      <div class="kicker" data-i18n="shKicker"></div>
      <div class="bigcard" id="bigCard">
        <span class="adult" id="shAdult" hidden>18+</span>
        <div class="bigtxt" id="shText"></div>
        <div class="byline" id="byShow" hidden></div>
        <button class="flip" type="button" id="shFlip"></button>
      </div>
      <p class="shnote" id="shNote"></p>
      <div class="stack">
        <button class="btn red" id="acceptBtn" data-i18n="accept"></button>
        <button class="btn plain" id="shNo" data-i18n="shNo"></button>
      </div>
    </section>
    <!-- ===== ACCEPTED ===== -->
    <section class="play" id="v-accept" hidden>
      <div class="kicker" data-i18n="accKicker"></div>
      <div class="ticket"><small>Dare <span class="adult" id="accAdult" hidden>18+</span></small><div id="accText"></div><div class="byline" id="byAcc" hidden></div></div>
      <p class="note" id="accNote"></p>
      <div class="stack">
        <button class="btn red" id="doneBtn" data-i18n="done"></button>
        <button class="btn plain" id="changeBtn" data-i18n="change"></button>
      </div>
    </section>

    <!-- ===== CONFIRM with the owner's code ===== -->
    <section class="play" id="v-confirm" hidden>
      <div class="kicker" data-i18n="cfKicker"></div>
      <h1 class="display" data-i18n="cfTitle"></h1>
      <p class="sub" id="cfSub"></p>
      <form class="codeform" id="codeForm" novalidate>
        <input id="codeIn" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" placeholder="• • • •" aria-label="Code">
        <p class="wlerr" id="codeErr" hidden></p>
        <p class="smallnote" id="codeDemo" hidden data-i18n="cfDemo"></p>
        <button class="btn red" type="submit" id="codeBtn" data-i18n="cfBtn"></button>
      </form>
      <button class="btn plain" id="codeSkip" data-i18n="cfSkip"></button>
    </section>

    <!-- ===== DONE + reveal ===== -->
    <section class="play" id="v-done" hidden>
      <h1 class="display" data-i18n="doneTitle"></h1>
      <p class="sub" data-i18n="doneSub"></p>
      <!-- rate the dare: empty stars, tap one -->
      <div class="rate" id="rateBox">
        <span class="ratel" id="rateL"></span>
        <div class="stars" id="stars" role="radiogroup"></div>
      </div>
      <!-- after a confirmed dare: a big nudge to follow the wearer -->
      <div class="igcard" id="igCard" hidden>
        <img class="igpic" id="igPic" alt="" hidden>
        <h2 class="display" id="igH"></h2>
        <a class="btn igbtn" id="igReveal" target="_blank" rel="noopener"></a>
      </div>
      <!-- dare skipped without the code: point back to it -->
      <div class="igcard locked" id="igLocked" hidden>
        <p id="igLockP"></p>
        <button class="btn" type="button" id="igLockBtn"></button>
      </div>
      <!-- a clean way out: back to your friends, or another dare -->
      <div class="stack exits" id="exits">
        <button class="btn red" type="button" id="anotherBtn" data-i18n="another"></button>
        <button class="btn" type="button" id="leaveBtn"></button>
      </div>
      <p class="byebye" id="byeMsg" hidden></p>
      <div class="wlbox light" style="text-align:left;margin:22px 0">
        <h2 class="display" data-i18n="pitchH"></h2>
        <p class="sub" data-i18n="pitchP"></p>
        <p class="sub launchline" data-i18n="pitchLaunch"></p>
        <div class="coupon"><span class="sc" aria-hidden="true">✂</span><b data-i18n="coupon"></b><small data-i18n="couponS"></small></div>
        <form class="wl" data-source="after-quest" novalidate>
          <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" maxlength="120" aria-label="Email">
          <p class="wlerr" hidden></p>
          <button class="btn red" type="submit"></button>
        </form>
        <p class="demo" hidden></p>
        <a class="more" data-to="club" data-i18n="seePlan"></a>
      </div>
      <div class="darebox">
        <h2 class="display" data-i18n="dareH"></h2>
        <p class="sub" data-i18n="dareP"></p>
        <form class="dareform">
          <textarea rows="2" maxlength="170" required data-i18n-ph="darePh"></textarea>
          <input type="text" maxlength="31" autocapitalize="off" autocorrect="off" autocomplete="off" data-i18n-ph="igPh">
          <button class="btn" type="submit" data-i18n="dareSend"></button>
          <p class="daremsg" hidden></p>
        </form>
      </div>
      <div class="stack">
        <a class="btn plain" data-to="wall" data-i18n="toWall"></a>
      </div>
    </section>
  </main>
</div>
<script src="../js/text.js"></script>
<script src="../js/copy.js"></script>
<script src="../js/langpick.js"></script>
<script src="../js/geo.js"></script>
<script src="../js/common.js"></script>
<script src="../js/quests.js"></script>
<script src="../js/shirts.js"></script>
<script src="../js/play.js"></script>
<script src="../js/passbar.js"></script>
<script src="/js/hello.js" defer></script>
</body>
</html>
