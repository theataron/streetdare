<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREETDARE · Contact</title>
<meta name="description" content="Questions about STREETDARE, collaborations with venues, brands and events, or press: write to us here.">
<meta name="theme-color" content="#fbf8ef">
<link rel="preload" href="../fonts/caprasimo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/night.js"></script>
<style>
.ct{padding:10px 0 60px}
.ct h1{font-size:clamp(2.4rem,11vw,3.2rem);color:var(--red);transform:rotate(-2deg);margin:14px 0 10px}
.ct .lead{margin:0 0 22px}
.ct form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ct input,.ct textarea{width:100%;font:500 1.05rem "DM Sans",sans-serif;padding:14px 16px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
.ct textarea{min-height:150px;resize:vertical}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{border:2px solid var(--ink);border-radius:99px;background:#fff;padding:9px 14px;font:700 .95rem "DM Sans",sans-serif;cursor:pointer;color:var(--ink)}
.topics button.on{background:var(--ink);color:var(--bg)}
#safeBox,#repBox{display:grid;gap:14px}
#safeBox[hidden],#repBox[hidden]{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:var(--red);font-weight:600;font-size:.92rem}
.done{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:22px 18px;box-shadow:var(--sh);text-align:center}
.done h2{font-family:"Caprasimo","Bookman Old Style",Georgia,serif;font-weight:400;font-size:1.8rem;color:var(--red);margin-bottom:8px}
.small{font-size:.86rem;color:var(--mute);margin-top:14px}
html.night .ct input,html.night .ct textarea,html.night .topics button{background:#2a2422;color:var(--ink)}
html.night .topics button.on{background:var(--ink);color:#121012}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark display" href="/?home=1" aria-label="STREETDARE">STREETD<i class="sdstar" aria-hidden="true"></i>RE</a>
    <div class="right">
      <button class="lang" id="lang" aria-label="Language">EN</button>
    </div>
  </header>

  <main class="ct">
    <section id="formBox">
      <h1 class="display" id="h"></h1>
      <p class="lead" id="lead"></p>
      <form id="f" novalidate>
        <div class="field"><label for="name" id="nameL"></label><input id="name" maxlength="80" autocomplete="name" required></div>
        <div class="field"><label for="email" id="emailL"></label><input id="email" type="email" maxlength="160" autocomplete="email" inputmode="email" autocapitalize="off" required></div>
        <div class="field"><span class="lbl" id="topicL"></span><div class="topics" id="topics"></div></div>
        <div id="safeBox" hidden>
          <div class="field"><span class="lbl" id="safeL"></span><div class="topics" id="safeKinds"></div></div>
          <div id="repBox" hidden>
            <p class="small" id="repNote" style="margin:0"></p>
            <div class="field"><label for="repWho" id="repWhoL"></label><input id="repWho" maxlength="160"></div>
            <div class="field"><label for="repWhen" id="repWhenL"></label><input id="repWhen" maxlength="160"></div>
          </div>
        </div>
        <div class="field"><label for="msg" id="msgL"></label><textarea id="msg" maxlength="3000" required></textarea></div>
        <div class="hp" aria-hidden="true"><label>Website <input id="website" tabindex="-1" autocomplete="off"></label></div>
        <p class="err" id="err" hidden></p>
        <button class="btn red" type="submit" id="send"></button>
      </form>
      <p class="small" id="note"></p>
    </section>
    <section class="done" id="doneBox" hidden>
      <h2 id="doneH"></h2>
      <p id="doneP"></p>
      <p style="margin-top:16px"><a class="btn" href="/?home=1" id="doneBack"></a></p>
    </section>
  </main>
  <footer>STREETDARE · Madrid · <a href="../privacy/">Privacy</a> · <a href="../terms/">Terms</a></footer>
</div>
<script src="../js/langpick.js"></script>
<script src="/js/copy.js"></script>
<script type="module">
import { sb, lang, setLang, getSession } from '../js/sb.js?v=5';
const $ = id => document.getElementById(id);
const T = {
  en:{ h:'Say hi 👋', lead:'Questions about the shirts or the Shirtless Pass, ideas for a collab with your venue, brand or event, or a press request: write here and it lands straight in Aron’s inbox.',
       nameL:'Your name', emailL:'Your email', topicL:'What is it about?', msgL:'Your message', send:'Send message', sending:'Sending…',
       topics:{ player:'Shirts & playing', collab:'Collaboration', press:'Press', safety:'Safety', other:'Something else' },
       safeL:'What do you need?', safeKinds:{ report:'Report someone', safety:'A safety question' },
       repNote:'Thanks for telling us. Only Aron reads this, the person you report is never told who wrote it, and we reply within 24 hours. If you are in danger right now, call 112.',
       repWhoL:'Who? Their name, username or the link on their shirt', repWhenL:'When and where did it happen?', msgRep:'What happened?', repWho:'Who', repWhen:'When / where',
       note:'We only use your email to reply to you.', needName:'Write your name.', needEmail:'Check your email address.', needMsg:'Write a slightly longer message.', wait:'Too many messages in a short time. Try again in an hour.', err:'Couldn’t send it. Try again in a moment.',
       doneH:'Sent! 🔥', doneP:'Thanks, {name}. Your message is on its way to Aron, and he’ll reply to {email}.', doneBack:'Back to STREETDARE' },
  es:{ h:'Escríbenos 👋', lead:'Preguntas sobre las camisetas o el Shirtless Pass, ideas para colaborar con tu local, marca o evento, o una petición de prensa: escribe aquí y llega directo al correo de Aron.',
       nameL:'Tu nombre', emailL:'Tu email', topicL:'¿Sobre qué es?', msgL:'Tu mensaje', send:'Enviar mensaje', sending:'Enviando…',
       topics:{ player:'Camisetas y juego', collab:'Colaboración', press:'Prensa', safety:'Seguridad', other:'Otra cosa' },
       safeL:'¿Qué necesitas?', safeKinds:{ report:'Denunciar a alguien', safety:'Una pregunta de seguridad' },
       repNote:'Gracias por contárnoslo. Solo lo lee Aron, la persona a la que denuncias nunca sabrá quién lo escribió, y te respondemos en menos de 24 horas. Si estás en peligro ahora mismo, llama al 112.',
       repWhoL:'¿Quién? Su nombre, usuario o el enlace de su camiseta', repWhenL:'¿Cuándo y dónde pasó?', msgRep:'¿Qué pasó?', repWho:'Quién', repWhen:'Cuándo / dónde',
       note:'Solo usamos tu email para responderte.', needName:'Escribe tu nombre.', needEmail:'Revisa tu email.', needMsg:'Escribe un mensaje un poco más largo.', wait:'Demasiados mensajes en poco tiempo. Prueba otra vez en una hora.', err:'No se ha podido enviar. Prueba otra vez en un momento.',
       doneH:'¡Enviado! 🔥', doneP:'Gracias, {name}. Tu mensaje va de camino a Aron, y te responderá a {email}.', doneBack:'Volver a STREETDARE' },
  hu:{ h:'Írj nekünk 👋', lead:'Kérdésed van a pólókról vagy a Shirtless Passról, együttműködnél a helyeddel, márkáddal vagy eseményeddel, vagy sajtóként keresel: írj ide, és egyenesen Áron postafiókjába érkezik.',
       nameL:'A neved', emailL:'Az e-mail-címed', topicL:'Miről szól?', msgL:'Az üzeneted', send:'Üzenet küldése', sending:'Küldés…',
       topics:{ player:'Pólók és játék', collab:'Együttműködés', press:'Sajtó', safety:'Biztonság', other:'Valami más' },
       safeL:'Miben segíthetünk?', safeKinds:{ report:'Valakit jelentenék', safety:'Biztonsági kérdés' },
       repNote:'Köszönjük, hogy szóltál. Csak Áron olvassa, akit jelentesz, sosem tudja meg, ki írta, és 24 órán belül válaszolunk. Ha most veszélyben vagy, hívd a 112-t.',
       repWhoL:'Ki? A neve, felhasználóneve vagy a pólóján lévő link', repWhenL:'Mikor és hol történt?', msgRep:'Mi történt?', repWho:'Ki', repWhen:'Mikor / hol',
       note:'Az e-mail-címedet csak arra használjuk, hogy válaszoljunk.', needName:'Írd be a neved.', needEmail:'Nézd meg az e-mail-címed.', needMsg:'Írj egy kicsit hosszabb üzenetet.', wait:'Túl sok üzenet rövid idő alatt. Próbáld újra egy óra múlva.', err:'Nem sikerült elküldeni. Próbáld újra egy kicsit később.',
       doneH:'Elküldve! 🔥', doneP:'Köszönjük, {name}. Az üzeneted úton van Áronhoz, és a(z) {email} címre válaszol.', doneBack:'Vissza a STREETDARE-re' }
};
let L = lang(), topic = new URLSearchParams(location.search).get('topic') || 'player', safeKind = 'report';
if (topic === 'report') topic = 'safety';
if (!T.en.topics[topic]) topic = 'player';
const t = k => (T[L] || T.en)[k] ?? T.en[k];
/* wording Aron has approved in /admin -> Copy wins over the text above */
if (window.sdCopy) sdCopy(T, 'contact', () => { try { paint(); } catch (e) {} });
function paint(){
  document.documentElement.lang = L;
  ['h','lead','nameL','emailL','topicL','msgL','send','note','doneH','doneBack'].forEach(k => $(k).textContent = t(k));
  const pills = (o, cur) => Object.entries(o).map(([k, v]) => '<button type="button" data-k="' + k + '" class="' + (k === cur ? 'on' : '') + '">' + v + '</button>').join('');
  $('topics').innerHTML = pills(t('topics'), topic);
  $('safeKinds').innerHTML = pills(t('safeKinds'), safeKind);
  ['safeL','repNote','repWhoL','repWhenL'].forEach(k => $(k).textContent = t(k));
  const rep = topic === 'safety' && safeKind === 'report';
  $('safeBox').hidden = topic !== 'safety'; $('repBox').hidden = !rep;
  $('msgL').textContent = rep ? t('msgRep') : t('msgL');
  if (window.paintLangPick) window.paintLangPick();
}
window.paintLangPick = langPicker($('lang'), () => L, c => { L = c; setLang(L); paint(); });
$('topics').onclick = e => { const b = e.target.closest('button'); if (!b) return; topic = b.dataset.k; paint(); };
$('safeKinds').onclick = e => { const b = e.target.closest('button'); if (!b) return; safeKind = b.dataset.k; paint(); };
paint();
// logged in: fill in name and email
getSession().then(async s => {
  if (!s || !s.user) return;
  if (!$('email').value) $('email').value = s.user.email || '';
  const { data } = await sb.from('profiles').select('name').eq('id', s.user.id).maybeSingle();
  if (data && data.name && !$('name').value) $('name').value = data.name;
}).catch(() => {});
$('f').onsubmit = async e => {
  e.preventDefault();
  const err = $('err'), name = $('name').value.trim(), email = $('email').value.trim(), msg = $('msg').value.trim();
  const fail = k => { err.textContent = t(k); err.hidden = false; };
  err.hidden = true;
  if (!name) return fail('needName');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('needEmail');
  if (msg.length < 5) return fail('needMsg');
  const rep = topic === 'safety' && safeKind === 'report';
  const sendTopic = topic === 'safety' ? safeKind : topic;
  const full = rep ? (t('repWho') + ': ' + ($('repWho').value.trim() || '-') + '\n' + t('repWhen') + ': ' + ($('repWhen').value.trim() || '-') + '\n\n' + msg).slice(0, 3000) : msg;
  const b = $('send'); b.disabled = true; b.textContent = t('sending');
  const { data, error } = await sb.rpc('send_contact', { p_name: name, p_email: email, p_topic: sendTopic, p_message: full, p_lang: L, p_hp: $('website').value });
  b.disabled = false; b.textContent = t('send');
  if (error) return fail('err');
  if (data === 'wait') return fail('wait');
  if (data === 'email') return fail('needEmail');
  if (data === 'short') return fail('needMsg');
  $('doneP').textContent = t('doneP').replace('{name}', name).replace('{email}', email);
  $('formBox').hidden = true; $('doneBox').hidden = false; window.scrollTo(0, 0);
};
</script>
<script src="/js/menu.js"></script>
<script src="/js/passbar.js"></script>
<script src="/js/hello.js" defer></script>
</body>
</html>
