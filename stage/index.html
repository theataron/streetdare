<!doctype html>
<html lang="en">

<body>
<div class="wrap">
  <header class="top">
    <a class="mark display" href="#home">STREETDARE</a>
    <div class="right">
      <button class="nightbtn" id="nightBtn" type="button" aria-label="Night mode">🌙</button>

          <div class="step"><h3 data-i18n="s3h"></h3><p data-i18n="s3p"></p></div>
        </div>

      <section>

          <div class="tile"><em>🎂</em><b data-i18n="f4h"></b><span data-i18n="f4p"></span></div>
        </div>

      <section>
        <h2 class="display" data-i18n="questsH"></h2>
        <p class="sub" data-i18n="questsP"></p>
        <div class="chips" id="chips"></div>
        <a class="btn" href="p/?s=demo" data-i18n="ctaTry" style="margin-top:18px"></a>
      </section>

      <section>
        <h2 class="display" data-i18n="getH"></h2>
        <div class="gets">
          <div><b data-i18n="g1h"></b><span data-i18n="g1p"></span></div>
          <div><b data-i18n="g2h"></b><span data-i18n="g2p"></span></div>
          <div><b data-i18n="g3h"></b><span data-i18n="g3p"></span></div>
          <div><b data-i18n="g4h"></b><span data-i18n="g4p"></span></div>
        </div>
        <a class="more" href="#shop" data-i18n="seePlan"></a>
      </section>

      <section>
        <h2 class="display" data-i18n="faqH"></h2>
        <div class="faq">
          <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
          <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
          <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
          <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
          <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
          <details><summary data-i18n="q6"></summary><p data-i18n="a6"></p></details>
          <details><summary data-i18n="q7"></summary><p data-i18n="a7"></p></details>
        </div>
      </section>

      <section id="shop">
        <div class="shop">
          <div class="kicker" data-i18n="shopKicker"></div>
          <h2 class="display" data-i18n="shopH"></h2>
          <div class="teeview black" id="teeView">
            <svg viewBox="40 8 140 128" aria-hidden="true">
              <path class="tee" d="M70 30L95 18Q110 28 125 18L150 30 170 55 152 66 146 58V128H74V58L68 66 50 55Z"/>
              <path class="collar" d="M95 18Q110 24 125 18"/>
              <text class="word" x="110" y="52">STREETDARE</text>
              <g class="qr"><rect x="92" y="60" width="36" height="36" rx="2" class="qbg"/>
                <path d="M95 63h9v9h-9zM116 63h9v9h-9zM95 84h9v9h-9z" class="qd"/>
                <path d="M107 64h3v3h-3zM107 70h6v3h-6zM98 75h3v6h-3zM104 76h6v3h-6zM113 75h3v3h-3zM119 76h6v3h-6zM110 82h3v6h-3zM116 84h3v3h-3zM122 83h3v9h-3zM107 89h3v4h-3zM116 90h4v3h-4z" class="qd"/></g>

          <div class="price"><b id="shopPrice"></b><span data-i18n="shopShip"></span></div>

            <div class="seg" id="colors"><button type="button" data-c="black" class="on"><i class="dot k"></i><span data-i18n="shopBlack"></span></button><button type="button" data-c="white"><i class="dot w"></i><span data-i18n="shopWhite"></span></button></div></div>
          <div class="opt"><span class="optl" data-i18n="shopSize"></span><div class="seg sizes" id="sizes"></div></div>
          <p class="wlerr sizeerr" id="sizeErr" hidden data-i18n="shopPickSize"></p>
          <button class="btn red" id="buyShirt"></button>
          <div class="or"><span data-i18n="shopOr"></span></div>
          <div class="pass">
            <div><b data-i18n="passH"></b><p data-i18n="passP"></p></div>
            <button class="btn" id="buyPass" data-i18n="passBuy"></button>

          <div class="stepper"><button type="button" id="gMinus" aria-label="-">−</button><div><b id="gN"></b><small data-i18n="grpPeople"></small></div><button type="button" id="gPlus" aria-label="+">+</button></div>
          <div class="gbar" id="gBar"><i></i></div>
          <div class="gsum"><div><b id="gEach"></b><small data-i18n="grpEach"></small></div><div><b id="gTotal"></b><small data-i18n="grpTotal"></small></div></div>
          <p class="gsave" id="gSave"></p>
          <p class="gnext" id="gNext"></p>
          <button class="btn red" id="buyGroup"></button>
          <p class="smallnote" data-i18n="grpNote"></p>
        </div>
        <div class="darebox">
          <h2 class="display" data-i18n="dareH"></h2>
          <p class="sub" data-i18n="dareP"></p>
          <form class="dareform">
            <textarea rows="2" maxlength="170" required data-i18n-ph="darePh"></textarea>
            <input type="text" maxlength="31" autocapitalize="off" autocorrect="off" autocomplete="off" data-i18n-ph="igPh">
            <button class="btn" type="submit" data-i18n="dareSend"></button>
            <p class="daremsg" hidden></p>
          </form>
        </div>
      </section>

      <nav class="footlinks"><a href="#about" data-i18n="mAbout"></a><a href="#wall" data-i18n="mWall"></a><a href="#shop" data-i18n="fComing"></a></nav>

        <textarea id="wallText" rows="3" maxlength="280" required data-i18n-ph="wallPh"></textarea>
        <input type="text" id="wallIg" maxlength="31" autocapitalize="off" autocorrect="off" autocomplete="off" data-i18n-ph="igPh">
